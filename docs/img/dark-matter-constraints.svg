<text x="70" y="34" fill="#eef0ff" font-size="20" font-weight="600">What has been ruled out as dark matter, on the triangle's axes</text>
<text x="70" y="56" fill="#a3a8d6" font-size="13">Primordial black holes (bands along the Schwarzschild line) and macro dark matter (regions). Each limit assumes the objects are all of the dark matter.</text>
