<line x1="319.06" y1="660" x2="490" y2="147.32000000000005" stroke="#4fc3f7" stroke-width="1" stroke-dasharray="6 4" opacity="0.7"/>
</g>
<line x1="70" y1="522.38" x2="492.38" y2="100" stroke="#ff6e6e" stroke-width="2"/>
<g clip-path="url(#bands)">
<line x1="62.9" y1="515.3" x2="107.3" y2="470.9" stroke="#ff9f43" stroke-width="5" stroke-linecap="butt"/>
<line x1="107.3" y1="470.9" x2="163.3" y2="414.9" stroke="#ff5c7c" stroke-width="5" stroke-linecap="butt"/>
