<line x1="377.4" y1="172.6" x2="405.4" y2="144.6" stroke="#4dd0e1" stroke-width="5" stroke-linecap="butt"/>
<line x1="370.3" y1="165.5" x2="440.3" y2="95.5" stroke="#81c784" stroke-width="5" stroke-linecap="butt"/>
