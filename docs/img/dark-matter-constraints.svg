<line x1="70" y1="170" x2="490" y2="170" stroke="#262a55" stroke-width="0.6"/>
<polygon points="274.1,660.0 490.0,660.0 490.0,310.0 449.1,310.0" fill="#8a8a9a" opacity="0.35"/>
