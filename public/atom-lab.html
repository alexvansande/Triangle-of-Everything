<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atom Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Syne:wght@600;700&display=swap">
<style>
/* An optical bench: the picture is light on black, so the page commits to one
   dark look. Viewport on the left, the instrument's controls in a rail on the right. */
:root {
  --bg: #06080c;          /* the bench */
  --panel: #0c1017;       /* control rail */
  --line: #1a2130;
  --fg: #dce4ef;
  --muted: #7b879a;
  --accent: #46dcff;      /* the electron's own blue */
  --warm: #ffb46e;        /* the proton's fringe */
  --display: "Syne", "Avenir Next", "Segoe UI", sans-serif;
  --body: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 var(--body);
  -webkit-font-smoothing: antialiased;
}
.app {
  display: grid; grid-template-columns: minmax(0, 1fr) 360px; height: 100%;
}
.stage {
  display: flex; flex-direction: column; gap: 12px; min-width: 0; min-height: 0; overflow: hidden;
  padding-block: 18px 14px;
  padding-left: max(18px, env(safe-area-inset-left, 0px)); padding-right: 18px;
}
header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
h1 { font: 700 22px/1 var(--display); letter-spacing: 0.02em; margin: 0; }
h1 span { color: var(--accent); }
.tag { color: var(--muted); font-size: 12px; }
.subjects { display: flex; flex-wrap: wrap; gap: 6px; }
.subjects button {
  font: 500 13px var(--body); color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px; cursor: pointer;
}
.subjects button:hover { color: var(--fg); border-color: #2b3546; }
.subjects button[aria-pressed="true"] { color: var(--bg); background: var(--accent); border-color: var(--accent); }
.subjects button:focus-visible, .rail button:focus-visible, .rail input:focus-visible, .rail select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.view {
  position: relative; flex: 1; min-height: 0; min-width: 0; display: grid; place-items: center; container-type: size;
}
/* the largest square that fits the space, whichever side is shorter */
.square { position: relative; width: min(100cqw, 100cqh); height: min(100cqw, 100cqh); }
.square canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; border-radius: 4px; }
.square canvas.dragging { cursor: grabbing; }
.ruler { position: absolute; inset: 0; pointer-events: none; }
.ruler span {
  position: absolute; font: 500 11px var(--mono); color: var(--fg); white-space: nowrap;
  transform: translate(8px, -50%); text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 6px #000;
}
.ruler span.left { transform: translate(calc(-100% - 8px), -50%); }
.caption { display: flex; flex-direction: column; gap: 4px; max-width: 72ch; }
.caption b { font: 600 15px var(--body); }
.caption p { margin: 0; color: var(--muted); }
details summary { cursor: pointer; color: var(--accent); font-size: 13px; }
details p { margin: 6px 0 0; color: var(--muted); }

.rail {
  background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; min-height: 0;
  padding-block: 14px 24px;
  padding-left: 18px; padding-right: max(18px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px;
}
.actions { display: flex; flex-wrap: wrap; gap: 6px; }
.presets { align-items: center; }
.presets span { font: 600 11px var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-right: 4px; }
.rail button {
  font: 500 12px var(--body); color: var(--fg); background: #141a24; border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; cursor: pointer;
}
.rail button:hover { border-color: #2f3a4d; }
fieldset { border: 0; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 9px; transition: opacity .2s; }
fieldset.idle { opacity: 0.42; }
legend {
  padding: 0 0 4px; font: 600 11px var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted);
  display: flex; gap: 8px; align-items: baseline; width: 100%;
}
legend small { letter-spacing: 0; text-transform: none; font-weight: 400; color: #566173; }
.row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; }
.row label { font-size: 13px; }
.row output { font: 400 11px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.row input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: var(--accent); }
.row.check, .row.color, .row.select { grid-template-columns: 1fr auto; }
.row input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.row input[type=color] { width: 36px; height: 22px; border: 1px solid var(--line); border-radius: 4px; background: none; padding: 0; }
.row select { font: 13px var(--body); color: var(--fg); background: #141a24; border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
.rebuild::after { content: " ↻"; color: #566173; font-size: 11px; }
.sheet {
  position: fixed; inset: 0; background: rgba(3, 5, 8, 0.86); display: grid; place-items: center; z-index: 20;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.sheet .card {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px;
  display: flex; flex-direction: column; gap: 10px; max-width: min(720px, 100%); max-height: 100%; overflow: auto;
}
.sheet img { max-width: 100%; max-height: 70vh; border-radius: 6px; align-self: center; }
.sheet textarea { width: 100%; min-height: 220px; box-sizing: border-box; font: 12px var(--mono); color: var(--fg); background: #06080c; border: 1px solid var(--line); border-radius: 6px; padding: 8px; }
.sheet .bar { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; }
.sheet .note { color: var(--muted); font-size: 12px; margin-right: auto; }
.sheet button { font: 500 13px var(--body); color: var(--fg); background: #141a24; border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
.sheet a { color: var(--accent); }
.error { color: var(--warm); padding: 24px; max-width: 60ch; }

@media (max-width: 820px) {
  .app { grid-template-columns: 1fr; height: auto; }
  .stage { padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); }
  .stage { overflow: visible; }
  .view { flex: none; container-type: normal; }
  .square { width: 100%; height: auto; aspect-ratio: 1; }
  .rail { border-left: 0; border-top: 1px solid var(--line); overflow: visible; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
}
@media (prefers-reduced-motion: reduce) { fieldset { transition: none; } }
</style>
</head>
<body>
<div class="app">
  <section class="stage">
    <header>
      <h1>Atom <span>Lab</span></h1>
      <span class="tag">Drag to turn · every picture shares the controls on the right</span>
    </header>
    <nav class="subjects" id="subjects" aria-label="Subject"></nav>
    <div class="view">
      <div class="square">
        <canvas id="canvas" aria-label="Rendered particle"></canvas>
        <div class="ruler" id="ruler" aria-hidden="true"></div>
      </div>
    </div>
    <div class="caption">
      <b id="title"></b>
      <p id="sub"></p>
      <details><summary>What you are looking at</summary><p id="why"></p></details>
    </div>
  </section>
  <aside class="rail" id="rail" aria-label="Controls">
    <div class="actions">
      <button id="snap">Snapshot</button>
      <button id="copy">Copy settings</button>
      <button id="paste">Paste settings</button>
      <button id="reset">Reset</button>
    </div>
    <div class="actions presets" id="presets"><span>Presets</span></div>
  </aside>
</div>

<script type="module">
import { PARTICLES, Renderer, HopfView, LOOK, ORBITALS } from './hopf/hopf-core.js';

const SUBJECTS = [
  ['proton', 'proton-scale', 'Proton'], ['neutron', 'neutron-scale', 'Neutron'], ['electron', 'electron', 'Electron'],
  ['hydrogen', 'hydrogen', 'Hydrogen'], ['deuterium', 'deuterium', 'Deuterium'], ['oxygen', 'oxygen', 'Oxygen'], ['water', 'water', 'Water'],
];
const NUCLEONS = ['proton', 'neutron'], ATOMS = ['hydrogen', 'deuterium', 'oxygen', 'water'];
const ALL = SUBJECTS.map(s => s[0]);
// page-level settings: camera and light
const VIEW_DEFAULT = { rotate: 0.12, bloom: 0.9, exposure: 1.1, width: 1, core: 0.8, drift: true, flow: true, labels: true };
const LOOK_DEFAULT = structuredClone(LOOK);
const VIEW = structuredClone(VIEW_DEFAULT);
// the lab's own starting look (the author's hydrogen, 2026-10-29): what a first
// visit opens with and Reset returns to. The shared defaults in hopf-core.js,
// which the chart's live icons read, stay as they are.
const HOME = { look: {
  probe: 0, protonFringe: 4, neutronFringe: 0, protonBall: 0.056, neutronBall: 0.043, neutronGrey: 0.46, quarks: 1.65,
  nucleusGain: 5.3, logScale: true, nucleusShare: 0.39, linearNucleus: 0.18, rings: 0, cloudFibers: 180, cloudGain: 2.75,
  cloudContrast: 1.15, cloudWidth: 0.005, dashes: 12, dashLength: 1, dashSpeed: 3, spin: 0.6, plusColor: '#46dcff',
  minusColor: '#9a5aff', coreColor: '#f0e6ff', hColor: '#006eff', orbital: '1s', showNucleus: true, showCloud: true, electronGain: 1,
}, view: { rotate: 0.24, bloom: 1, exposure: 1.1, width: 0.55, core: 0.75, drift: true, flow: true, labels: false } };
const gev = r => 0.1 * 1000 ** r;
const fmtGev = r => { const g = gev(r); return `${g < 1 ? g.toFixed(2) : g < 10 ? g.toFixed(1) : g.toFixed(0)} GeV`; };

// [key, label, min, max, step, store, rebuild, format] or { type } rows
const GROUPS = [
  { name: 'Nucleons', note: 'proton, neutron, every nucleus', used: [...NUCLEONS, ...ATOMS], rows: [
    { k: 'probe', label: 'Probe resolution', min: 0, max: 1, step: 0.01, fmt: fmtGev },
    { k: 'protonFringe', label: 'Proton fringes', min: 0, max: 4, step: 0.05 },
    { k: 'neutronFringe', label: 'Neutron fringes', min: 0, max: 3, step: 0.05 },
    { k: 'neutronGrey', label: 'Neutron grey', min: 0, max: 1, step: 0.01 },
    { k: 'protonBall', label: 'Proton glow', min: 0, max: 0.08, step: 0.001 },
    { k: 'neutronBall', label: 'Neutron glow', min: 0, max: 0.08, step: 0.001 },
    { k: 'quarks', label: 'Quark brightness', min: 0, max: 3, step: 0.05 },
    { k: 'nucleusGain', label: 'Nucleus brightness in atoms', min: 0, max: 6, step: 0.05, used: ATOMS },
    { k: 'showNucleus', label: 'Show nucleus', type: 'check', used: ATOMS },
  ] },
  { name: 'Electron cloud', note: 'atoms and water', used: ATOMS, rows: [
    { k: 'orbital', label: 'Hydrogen electron state', type: 'select', rebuild: true, used: ['hydrogen', 'deuterium'],
      // energy of level n: −13.6 eV / n²
      options: Object.entries(ORBITALS).map(([o, [n]]) => [o, n === 1 ? `${o} · ground state` : `${o} · excited, ${(-13.6 / n / n).toFixed(2)} eV`]) },
    { k: 'cloudFibers', label: 'Hopf circles', min: 30, max: 400, step: 10, rebuild: true },
    { k: 'cloudGain', label: 'Brightness', min: 0, max: 8, step: 0.05 },
    { k: 'cloudContrast', label: 'Contrast', min: 0.3, max: 3, step: 0.05 },
    { k: 'cloudWidth', label: 'Line width', min: 0.002, max: 0.03, step: 0.0005 },
    { k: 'dashes', label: 'Dashes per circle (0 = whole)', min: 0, max: 12, step: 1 },
    { k: 'dashLength', label: 'Dash length', min: 0.02, max: 1, step: 0.01, fmt: v => v >= 1 ? 'whole' : `${Math.round(v * 100)}%` },
    { k: 'dashSpeed', label: 'Dash speed', min: -3, max: 3, step: 0.05 },
    { k: 'spin', label: 'Circle spin', min: -5, max: 5, step: 0.1 },
    { k: 'plusColor', label: 'Electron colour (ψ > 0)', type: 'color' },
    { k: 'minusColor', label: 'Negative phase (ψ < 0)', type: 'color', used: ['hydrogen', 'deuterium'] },
    { k: 'coreColor', label: 'Inner-shell colour', type: 'color', used: ['oxygen', 'water'] },
    { k: 'hColor', label: 'Hydrogens\' electrons', type: 'color', used: ['water'] },
    { k: 'showCloud', label: 'Show cloud', type: 'check' },
  ] },
  { name: 'Scale', note: 'atoms and water', used: ATOMS, rows: [
    { k: 'logScale', label: 'Log scale', type: 'check', rebuild: true },
    { k: 'nucleusShare', label: 'Room for the nucleus', min: 0.05, max: 0.8, step: 0.01, rebuild: true, fmt: v => `${Math.round(v * 100)}%` },
    { k: 'linearNucleus', label: 'Nucleus size at linear scale', min: 0.02, max: 0.6, step: 0.01, rebuild: true, fmt: v => `${Math.round(v * 100)}%` },
    { k: 'rings', label: 'Ring brightness', min: 0, max: 1, step: 0.01 },
    { k: 'labels', label: 'Ring labels', type: 'check', store: VIEW },
  ] },
  { name: 'Electron', note: 'the particle on its own', used: ['electron'], rows: [
    { k: 'electronGain', label: 'Torus brightness', min: 0, max: 3, step: 0.05 },
  ] },
  { name: 'Camera and light', note: 'everything', used: ALL, rows: [
    { k: 'rotate', label: 'Auto-rotate', min: -1, max: 1, step: 0.01, store: VIEW },
    { k: 'bloom', label: 'Bloom', min: 0, max: 3, step: 0.05, store: VIEW },
    { k: 'exposure', label: 'Exposure', min: 0.2, max: 3, step: 0.05, store: VIEW },
    { k: 'width', label: 'Tube width', min: 0.3, max: 3, step: 0.05, store: VIEW },
    { k: 'core', label: 'Highlight', min: 0, max: 2, step: 0.05, store: VIEW },
    { k: 'drift', label: '4D drift', type: 'check', store: VIEW },
    { k: 'flow', label: 'Motion', type: 'check', store: VIEW },
  ] },
];

// ---- state: remembered in this browser only ----
const KEY = 'atom-lab-v1';
let subject = 'hydrogen';
function save() { try { localStorage.setItem(KEY, JSON.stringify({ subject, look: LOOK, view: VIEW })); } catch {} }
function apply(state) {
  if (!state || typeof state !== 'object') return false;
  for (const [k, v] of Object.entries(state.look || {})) if (k in LOOK_DEFAULT && typeof v === typeof LOOK_DEFAULT[k]) LOOK[k] = v;
  for (const [k, v] of Object.entries(state.view || {})) if (k in VIEW_DEFAULT && typeof v === typeof VIEW_DEFAULT[k]) VIEW[k] = v;
  if (ALL.includes(state.subject)) subject = state.subject;
  return true;
}
let remembered = false;
try { remembered = apply(JSON.parse(localStorage.getItem(KEY))); } catch {}
if (!remembered) apply(HOME);
const fromHash = location.hash.slice(1);
if (ALL.includes(fromHash)) subject = fromHash;

// ---- controls ----
const rail = document.getElementById('rail');
const inputs = [];
for (const g of GROUPS) {
  const fs = document.createElement('fieldset');
  fs.innerHTML = `<legend>${g.name} <small>${g.note}</small></legend>`;
  fs.used = g.used;
  for (const r of g.rows) {
    const store = r.store || LOOK, id = `c-${r.k}`, row = document.createElement('div');
    const type = r.type || 'range';
    row.className = `row ${type}`;
    const label = `<label for="${id}"${r.rebuild ? ' class="rebuild"' : ''}>${r.label}</label>`;
    if (type === 'range') row.innerHTML = `${label}<output></output><input id="${id}" type="range" min="${r.min}" max="${r.max}" step="${r.step}">`;
    else if (type === 'check') row.innerHTML = `${label}<input id="${id}" type="checkbox">`;
    else if (type === 'color') row.innerHTML = `${label}<input id="${id}" type="color">`;
    else row.innerHTML = `${label}<select id="${id}">${r.options.map(([v, t]) => `<option value="${v}">${t}</option>`).join('')}</select>`;
    const el = row.querySelector(`#${id}`), out = row.querySelector('output');
    const show = () => { if (out) out.textContent = r.fmt ? r.fmt(store[r.k]) : +(+store[r.k]).toFixed(4); };
    const sync = () => {
      if (type === 'check') el.checked = store[r.k]; else el.value = store[r.k];
      show();
    };
    el.addEventListener('input', () => {
      store[r.k] = type === 'check' ? el.checked : type === 'range' ? +el.value : el.value;
      show();
      if (r.rebuild) scheduleRebuild();
      save();
    });
    row.used = r.used;
    inputs.push(sync);
    sync();
    fs.append(row);
  }
  rail.append(fs);
}
const syncAll = () => inputs.forEach(f => f());
function markUsed() {
  for (const fs of rail.querySelectorAll('fieldset')) {
    fs.classList.toggle('idle', !fs.used.includes(subject));
    for (const row of fs.querySelectorAll('.row')) row.style.opacity = row.used && !row.used.includes(subject) && fs.used.includes(subject) ? 0.42 : '';
  }
}

// ---- subjects ----
const nav = document.getElementById('subjects');
for (const [key, , label] of SUBJECTS) {
  const b = document.createElement('button');
  b.textContent = label;
  b.dataset.key = key;
  b.addEventListener('click', () => { subject = key; history.replaceState(null, '', `#${key}`); rebuild(); save(); });
  nav.append(b);
}
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (ALL.includes(h) && h !== subject) { subject = h; rebuild(); } });

// ---- rendering ----
const canvas = document.getElementById('canvas'), ruler = document.getElementById('ruler');
let renderer, view = null;
try { renderer = new Renderer(); } catch (err) {
  document.querySelector('.view').innerHTML = `<p class="error">This needs WebGL2, which this browser did not provide (${err.message}). Try a recent Chrome, Edge, Firefox or Safari.</p>`;
}
// HopfView binds dragging to its canvas; one canvas is reused, so keep one set of listeners
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = [e.clientX, e.clientY]; canvas.setPointerCapture(e.pointerId); canvas.classList.add('dragging'); });
canvas.addEventListener('pointermove', e => {
  if (!drag || !view) return;
  view.yaw += (e.clientX - drag[0]) * 0.008;
  view.pitch = Math.max(-1.4, Math.min(1.4, view.pitch + (e.clientY - drag[1]) * 0.008));
  drag = [e.clientX, e.clientY];
});
const endDrag = () => { drag = null; canvas.classList.remove('dragging'); };
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);

let rebuildTimer = 0;
function scheduleRebuild() { clearTimeout(rebuildTimer); rebuildTimer = setTimeout(rebuild, 200); }
function rebuild() {
  for (const b of nav.children) b.setAttribute('aria-pressed', b.dataset.key === subject);
  markUsed();
  const particle = PARTICLES.find(p => p.id === SUBJECTS.find(s => s[0] === subject)[1]);
  document.getElementById('title').textContent = particle.name.replace(' · by resolution', '');
  document.getElementById('sub').textContent = particle.sub;
  document.getElementById('why').textContent = particle.why;
  if (!renderer) return;
  const old = view;
  view = new HopfView(renderer, null, particle);
  view.ctx = canvas.getContext('2d');
  view.canvas = canvas;
  if (old) { view.yaw = old.yaw; view.pitch = old.pitch; }
  else view.yaw = 0.6;
}

// the ruler's labels, where each ring is nearest the viewer
function placeLabels() {
  const ticks = view.particle.ticks?.filter(t => t[0]);
  if (!VIEW.labels || !ticks || !ticks.length || !view.center) { ruler.replaceChildren(); return; }
  const fov = (view.particle.fov ?? 28 * Math.PI / 180), dist = view.radius * 1.32 / Math.sin(fov / 2);
  const c = view.center, cp = Math.cos(view.pitch);
  const eye = [c[0] + dist * cp * Math.sin(view.yaw), c[1] + dist * Math.sin(view.pitch), c[2] + dist * cp * Math.cos(view.yaw)];
  const nz = [eye[0] - c[0], eye[1] - c[1], eye[2] - c[2]].map(v => v / dist);
  const hx = Math.hypot(nz[0], nz[2]) || 1, nx = [nz[2] / hx, 0, -nz[0] / hx];
  const ny = [nz[1] * nx[2] - nz[2] * nx[1], nz[2] * nx[0] - nz[0] * nx[2], nz[0] * nx[1] - nz[1] * nx[0]];
  const f = 1 / Math.tan(fov / 2), W = ruler.clientWidth;
  if (ruler.children.length !== ticks.length) ruler.replaceChildren(...ticks.map(() => document.createElement('span')));
  ticks.forEach(([label, x, at = [0, 0, 0]], i) => {
    const p = [at[0] + x * nz[0] / hx, at[1], at[2] + x * nz[2] / hx], d = p.map((v, a) => v - eye[a]);
    const cx = d[0] * nx[0] + d[1] * nx[1] + d[2] * nx[2], cy = d[0] * ny[0] + d[1] * ny[1] + d[2] * ny[2], cz = -(d[0] * nz[0] + d[1] * nz[1] + d[2] * nz[2]);
    const s = ruler.children[i];
    s.textContent = label;
    s.className = i % 2 ? 'left' : '';
    s.style.left = `${W / 2 * (1 + f * cx / cz)}px`;
    s.style.top = `${W / 2 * (1 - f * cy / cz)}px`;
    s.hidden = label === '1 fm';  // sits on the nucleus
  });
}

const opts = () => ({ drift: VIEW.drift, flow: VIEW.flow, width: VIEW.width, bloom: VIEW.bloom, exposure: VIEW.exposure, core: VIEW.core });
// render below full resolution while frames run slow, back up when they're quick
let time = 0, prev = performance.now(), quality = 1, slow = 0.016;
function frame(now) {
  const raw = (now - prev) / 1000, dt = Math.min(0.1, raw);
  prev = now;
  slow += (raw - slow) * 0.1;
  if (slow > 0.045) quality = Math.max(0.35, quality * 0.97);
  else if (slow < 0.025) quality = Math.min(1, quality * 1.01);
  if (view) {
    const o = opts();
    if (o.drift || o.flow) time += dt;
    const px = Math.min(1600, Math.max(192, Math.round(canvas.clientWidth * Math.min(2, devicePixelRatio || 1) * quality / 32) * 32));
    renderer.resize(px);
    if (canvas.width !== px) canvas.width = canvas.height = px;
    if (!drag) view.yaw += dt * VIEW.rotate;
    if (view.particle.resolution !== undefined) view.res = LOOK.probe;
    view.update(time, o);
    renderer.render(view, o);
    placeLabels();
  }
  requestAnimationFrame(frame);
}

// ---- actions ----
function sheet(build) {
  const s = document.createElement('div');
  s.className = 'sheet';
  s.innerHTML = '<div class="card"></div>';
  const close = () => s.remove();
  s.addEventListener('click', e => { if (e.target === s) close(); });
  addEventListener('keydown', function esc(e) { if (e.key === 'Escape') { close(); removeEventListener('keydown', esc); } });
  build(s.firstChild, close);
  document.body.append(s);
}
document.getElementById('snap').addEventListener('click', () => {
  if (!view) return;
  const url = canvas.toDataURL('image/png');
  sheet((card, close) => {
    card.innerHTML = `<img alt="Snapshot of the ${subject}" src="${url}"><div class="bar"><span class="note">Right-click or long-press the picture to save it.</span><a href="${url}" download="atom-lab-${subject}.png">Download</a><button>Close</button></div>`;
    card.querySelector('button').onclick = close;
  });
});
document.getElementById('copy').addEventListener('click', e => {
  const text = JSON.stringify({ subject, look: LOOK, view: VIEW }, null, 2), btn = e.currentTarget;
  navigator.clipboard.writeText(text).then(() => { btn.textContent = 'Copied'; setTimeout(() => btn.textContent = 'Copy settings', 1500); }, () => {
    sheet((card, close) => {
      card.innerHTML = '<textarea readonly aria-label="Settings"></textarea><div class="bar"><span class="note">Select all and copy.</span><button>Close</button></div>';
      card.querySelector('textarea').value = text;
      card.querySelector('textarea').select();
      card.querySelector('button').onclick = close;
    });
  });
});
document.getElementById('paste').addEventListener('click', () => {
  sheet((card, close) => {
    card.innerHTML = '<textarea aria-label="Settings to apply" placeholder="Paste settings copied from Atom Lab"></textarea><div class="bar"><span class="note"></span><button data-a="cancel">Cancel</button><button data-a="apply">Apply</button></div>';
    const ta = card.querySelector('textarea'), note = card.querySelector('.note');
    ta.focus();
    card.querySelector('[data-a=cancel]').onclick = close;
    card.querySelector('[data-a=apply]').onclick = () => {
      let state;
      try { state = JSON.parse(ta.value); } catch { note.textContent = 'That is not valid settings text. Copy it again from Atom Lab.'; return; }
      apply(state); syncAll(); rebuild(); save(); close();
    };
  });
});
document.getElementById('reset').addEventListener('click', () => {
  Object.assign(LOOK, structuredClone(LOOK_DEFAULT));
  Object.assign(VIEW, structuredClone(VIEW_DEFAULT));
  apply(HOME);
  syncAll(); rebuild(); save();
});

// saved looks: each sets every control and its subject, over the defaults
const PRESETS = [
  ['Hydrogen 1s', { subject: 'hydrogen', ...HOME }],
  ['Water', { subject: 'water', ...HOME }],
  ['Deuterium 3p', { subject: 'deuterium', look: {
    probe: 0, protonFringe: 4, neutronFringe: 0.35, protonBall: 0.056, neutronBall: 0.02, neutronGrey: 0.41, quarks: 0.85,
    nucleusGain: 2.25, logScale: true, nucleusShare: 0.39, linearNucleus: 0.18, rings: 0, cloudFibers: 180, cloudGain: 2.75,
    cloudContrast: 1.15, cloudWidth: 0.005, dashes: 12, dashLength: 1, dashSpeed: 3, spin: 0.6, plusColor: '#46dcff',
    minusColor: '#9a5aff', coreColor: '#f0e6ff', hColor: '#006eff', orbital: '3p', showNucleus: true, showCloud: true, electronGain: 1,
  }, view: { rotate: 0.24, bloom: 1, exposure: 1.1, width: 0.55, core: 0.75, drift: true, flow: true, labels: false } }],
];
for (const [name, state] of PRESETS) {
  const b = document.createElement('button');
  b.textContent = name;
  b.addEventListener('click', () => {
    Object.assign(LOOK, structuredClone(LOOK_DEFAULT));
    Object.assign(VIEW, structuredClone(VIEW_DEFAULT));
    apply(state);
    history.replaceState(null, '', `#${subject}`);
    syncAll(); rebuild(); save();
  });
  document.getElementById('presets').append(b);
}

rebuild();
requestAnimationFrame(frame);
</script>
