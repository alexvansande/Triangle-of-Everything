<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electromagnetic Spectrum</title>
<!--
  The sky, the Sun or the Earth seen through a movable RGB "eye". Each target
  is a set of single-band maps (radio → gamma), each normalised to 0…1:
    npm run build:sky-spectrum · build:sun-spectrum · build:earth-spectrum
  The rainbow selector on the spectrum bar places the red, green and blue
  channels: slide it to shift all three along the spectrum, drag its ends to
  spread them. Each channel is a soft (Gaussian) average of the bands near its
  position, wider as the selector stretches; weights sum to one, so brightness
  stays even. Bands are evenly spaced on the bar, not to scale.
  Sky only: a distance window drops every band's light whose depth (where
  along the line of sight it comes from) falls outside it, in every view.
  Inside also shows Earth at the centre, in the same bands, the sky behind it.
  The Cloud's light adds up in a floating-point buffer and is shown linearly by
  default, so the outer shell (CMB) reads as dots; Log brightness ("Lift faint")
  opts into a log tone map that lifts sparse far points beside the bright centre.
  In the Cloud each point takes its own distance from its direction's spread
  of starlight, dust and halo light (six quantiles per direction), so the
  Galaxy shows its depth, not one average per direction.
  In the Cloud, microwave and X-ray light is split into a background that
  carries on behind the disc — the CMB (Planck's component-separated map) at
  46 Gly, the cosmic X-ray background (uniform, dimmed by the Galaxy's gas) at
  z ≈ 1 — and everything in front at its own depth.
  Zooming out past Inside's widest view hands over to the Cloud (log scale,
  Earth at the centre, same size, same side); zooming in on Earth returns.
  Then:  npm run dev  →  http://localhost:5173/spectrum/  (the chart opens it from
  every photon: embedded in the sidebar with ?embed=1, or full in a new tab)
  Cloud radius: Custom (Milky Way on the inner 80%, log; the rest on the outer
  20%), Log (radius ∝ log distance in units from 1,000 km to billions of ly;
  anything nearer than one unit is hidden; with a unit below Earth's radius,
  Earth is drawn at the centre: axis to the pole, turned for now, all daylit;
  between Earth's and the Sun's radius, the Sun; both in the selector's
  wavelengths) or Linear (radius ∝ distance, where zooming moves the scale
  through powers of ten). Concentric circles behind the cloud mark powers of
  ten of distance; translucent discs show the Sun's yearly path, the Oort
  Cloud and the Milky Way (an off-centre circle, each edge point at its own
  log distance), each while it is a sensible size on screen (?rings=0 hides them).
  ?embed=1 (bar and view only, for the chart's sidebar)  ?target=sky|sun|earth  ?view=globe|inside|map|cloud  ?c=&s=  ?dlo=&dhi=
  ?video=1 (narrated videos: only the view (&bar=1: and the spectrum bar), nothing moves by
  itself; the narration sets every frame with window.spectrumVideo.set({…}) or a
  {type: "spectrum-state", state} message; see setVideo below)
  ?bright=lin|log  ?lift= (0…1, how strong the log brightness is)  ?radius=custom|log|linear  ?dot= (point size ×)  ?unit= (log10 ly)  ?lz= (log10 ly at radius 1)  ?zoom=
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap">
<style>
  /* One dark instrument: spectrum and distance bars on top, the view filling the rest. */
  :root {
    --sky: #000; --fg: #e9ecf5; --dim: #8f95ab; --line: rgba(205, 215, 255, 0.14); --panel: #0b0d15;
    --display: "Instrument Serif", Georgia, serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; background: var(--sky); color: var(--fg); font: 13px/1.35 var(--body); }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 4px; }
  header h1 { margin: 0; font: 400 30px/1 var(--display); }
  header p { margin: 0; color: var(--dim); }
  .controls { margin-left: auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .controls label { color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
  .controls input[type=range] { width: 96px; accent-color: var(--fg); }
  button { background: #191d2b; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; }
  .seg button:first-child { border-radius: 6px 0 0 6px; } .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--sky); }

  /* spectrum bar: equal slots, regions above, selector on top; fits the width */
  #bar { position: relative; user-select: none; touch-action: none; margin-top: 4px; }
  #regions { display: flex; height: 18px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); }
  #regions div { border-left: 1px solid var(--line); padding-left: 4px; overflow: hidden; white-space: nowrap; min-width: 0; }
  #slots { display: flex; height: 64px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; position: relative; }
  #slots .slot { flex: 1; border-left: 1px solid var(--line); position: relative; min-width: 0; }
  #slots .slot:first-child { border-left: 0; }
  #slots .slot span { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%) rotate(180deg);
    writing-mode: vertical-rl; white-space: nowrap; max-height: 56px; overflow: hidden; text-overflow: ellipsis; font-size: 9.5px; color: var(--dim); }
  #slots .slot.empty { background: repeating-linear-gradient(45deg, transparent 0 4px, rgba(255,255,255,0.05) 4px 8px); }
  #curves { position: absolute; left: 0; top: 18px; width: 100%; height: 64px; pointer-events: none; }
  .win { position: absolute; border-radius: 6px; cursor: grab; touch-action: none; box-shadow: 0 0 0 1.5px rgba(255,255,255,0.8) inset; }
  .win:active { cursor: grabbing; }
  .win .grip { position: absolute; top: 0; bottom: 0; width: 22px; cursor: ew-resize; }
  .win .grip::after { content: ""; position: absolute; top: 25%; bottom: 25%; left: 9px; width: 4px; border-radius: 2px; background: #fff; }
  .win .grip.a { left: -11px; } .win .grip.b { right: -11px; }
  #selector { top: 18px; height: 64px; background: linear-gradient(90deg, rgba(255,40,40,0.38), rgba(40,255,60,0.38), rgba(60,90,255,0.38)); }
  #readout { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; height: 1.3em; padding: 5px 0 2px; font: 11.5px/1.3 var(--mono); }
  #readout .ch { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* distance bar (sky only) */
  #dist { position: relative; height: 44px; margin-top: 4px; user-select: none; touch-action: none; }
  #dist[hidden] { display: none; }
  #dtrack { position: absolute; left: 0; right: 0; top: 14px; height: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .zone { position: absolute; top: 0; height: 13px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim);
    border-left: 1px solid var(--line); padding-left: 4px; white-space: nowrap; overflow: hidden; }
  .dtick { position: absolute; top: 33px; font: 10px var(--mono); color: var(--dim); transform: translateX(-50%); white-space: nowrap; }
  #dwin { top: 14px; height: 18px; background: rgba(255,255,255,0.14); }
  #dreadout { height: 1.3em; padding: 0 0 2px; font: 11.5px/1.3 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
  #dreadout[hidden] { display: none; }

  #stage { flex: 1; min-height: 0; position: relative; margin-top: 4px; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; z-index: 1; }
  #views { position: absolute; top: 8px; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 3; }
  #status { color: var(--dim); font-size: 12px; }
  /* simple options under the view: where to look from, natural colour and,
     for Galaxy and Universe, the 3D view's scale and brightness */
  #targets, .controls label, #dist, #dreadout, #views { display: none !important; }
  #options { display: flex; gap: 8px 14px; align-items: center; flex-wrap: wrap; padding-top: 8px; padding-bottom: 6px; }
  #radius { display: flex; gap: 8px 10px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--dim); }
  #radius[hidden], #radius [hidden] { display: none; }
  #radius label { display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
  #radius input[type=range] { width: 160px; accent-color: var(--fg); }
  #radius output { font-family: var(--mono); color: var(--fg); white-space: nowrap; }
  #linBox { display: inline-flex; gap: 6px 10px; align-items: center; flex-wrap: wrap; }
  #goto { flex-wrap: wrap; } #goto button { padding: 3px 7px; font-size: 12px; white-space: nowrap; }
  /* Cloud scale: unit circles behind the canvas (it is transparent where
     there is nothing), their labels and the discs' names in front */
  #rings, #ringText { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #rings { z-index: 0; } #ringText { z-index: 2; }
  #rings svg, #ringText svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  #rings circle { fill: none; stroke: rgba(233, 236, 245, 0.13); stroke-width: 1; }
  #rings circle.major { stroke: rgba(233, 236, 245, 0.3); }
  #ringText text { font: 10.5px var(--mono); fill: rgba(233, 236, 245, 0.7); paint-order: stroke; stroke: #000; stroke-width: 3px; }
  #ringText text.ref { fill: rgba(255, 214, 140, 0.9); }
  body.video #ringText text { font-size: 15px; }   /* a video's names, readable on a phone */
  #ringText circle { fill: rgba(255, 214, 140, 0.9); }
  footer { padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); color: var(--dim); font-size: 11px; }
  body.app header { padding-right: 56px; }
  /* embedded in the chart's sidebar (?embed=1): just the spectrum bar and the view */
  body.embed header, body.embed #dist, body.embed #dreadout, body.embed footer,
  body.embed #radius, body.embed #views, body.embed #reset { display: none !important; }
  body.embed #options { padding: 6px 8px; } body.embed #explore button { padding: 3px 8px; font-size: 12px; }
  body.embed .pad { padding-left: 8px; padding-right: 8px; }
  body.embed #bar { margin-top: 6px; }
  body.embed #slots .slot span { display: none; }
  body.embed #slots, body.embed #selector, body.embed #curves { height: 40px; }
  body.embed #regions { font-size: 9px; letter-spacing: 0; }
  body.embed #regions div[data-short]::before { content: attr(data-short); font-size: 9px; } body.embed #regions div[data-short] { font-size: 0; }
  body.embed #readout { font-size: 10px; gap: 6px; }
  body.embed #stage { margin-top: 0; }
  /* driven by a narrated video (?video=1): the spectrum bar over the view, nothing else */
  body.video header, body.video #readout, body.video #dist, body.video #dreadout, body.video footer,
  body.video #options, body.video #views, body.video .grip { display: none !important; }
  body.video:not(.bar) #bar { display: none; }   /* a video draws its own bar: the chart's Compton line */
  body.video.bar #bar { margin-top: 10vh; }   /* ?bar=1: the explorer's own, below a phone app's top bar */
  body.video #slots .slot span { display: none; }
  body.video #regions { font-size: 12px; letter-spacing: 0.04em; }
  body.video #stage { margin-top: 0; }
  @media (max-width: 700px) {
    header h1 { font-size: 24px; } header p { display: none; } .controls { margin-left: 0; gap: 8px; }
    .controls input[type=range] { width: 70px; }
    #slots .slot span { display: none; }   /* too narrow for names: the readout names the bands */
    #slots { height: 48px; } #selector, #curves { height: 48px; }
    #regions { font-size: 9px; letter-spacing: 0; }
    #regions div[data-short]::before { content: attr(data-short); } #regions div[data-short] { font-size: 0; }
    #regions div[data-short]::before { font-size: 9px; }
    .zone { font-size: 8.5px; }
    #readout { gap: 8px; font-size: 10.5px; }
    #radius { gap: 6px 8px; font-size: 11px; } #radius input[type=range] { width: 96px; }
  }
</style>
</head>
<body>
<header class="pad">
  <h1 id="h1">Electromagnetic Spectrum</h1>
  <p id="sub">Slide the rainbow to see with different eyes. Drag its ends to stretch it.</p>
  <div class="controls">
    <span class="seg" id="targets" role="group" aria-label="Target">
      <button data-target="sky" aria-pressed="true">Sky</button><button data-target="sun" aria-pressed="false">Sun</button><button data-target="earth" aria-pressed="false">Earth</button>
    </span>
    <label>Exposure <input id="exposure" type="range" min="0.3" max="3" step="0.01" value="1"></label>
    <label>Contrast <input id="contrast" type="range" min="0.4" max="2.5" step="0.01" value="1"></label>
    <span id="status" role="status">Loading…</span>
  </div>
</header>
<div class="pad">
  <div id="bar">
    <div id="regions"></div>
    <div id="slots"></div>
    <canvas id="curves"></canvas>
    <div id="selector" class="win" tabindex="0" aria-label="RGB selector: arrows move it, shift+arrows stretch it"><div class="grip a"></div><div class="grip b"></div></div>
  </div>
  <div id="readout"></div>
  <div id="dist" hidden>
    <div id="zones"></div>
    <div id="dtrack"></div>
    <div id="dwin" class="win" tabindex="0" aria-label="Distance window: arrows move it, shift+arrows stretch it"><div class="grip a"></div><div class="grip b"></div></div>
    <div id="dticks"></div>
  </div>
  <div id="dreadout" hidden></div>
</div>
<div id="stage">
  <div id="rings"></div>
  <div id="ringText"></div>
  <div id="views" class="seg" role="group" aria-label="View"></div>
</div>
<div id="options" class="pad">
  <span class="seg" id="explore" role="group" aria-label="Look from">
    <button data-x="earth" title="The sky from just outside Earth, Earth floating in the middle">Earth</button><button data-x="sun" title="The Sun in front of the sky">Sun</button><button data-x="galaxy" title="The Milky Way around us in 3D, to scale">Galaxy</button><button data-x="universe" title="The whole universe in 3D by log distance, Earth in the middle">Universe</button>
  </span>
  <button id="reset">Natural colour</button>
  <div id="radius" hidden>
    <span class="seg" id="rmodes" role="group" aria-label="Radius scale">
      <button data-r="0" title="Milky Way on the inner 80% (log), everything beyond on the outer 20%">Custom</button><button data-r="1" title="Radius grows with log distance from the chosen unit">Log</button><button data-r="2" title="Radius proportional to distance; zoom moves through powers of ten">Linear</button>
    </span>
    <label id="unitBox">1 unit <input id="unit" type="range" min="-10" max="10" step="0.01" value="0" aria-label="Log scale unit"> <output id="unitOut"></output></label>
    <span id="linBox">radius 1 = <output id="linOut"></output> · scroll or pinch to zoom
      <span class="seg" id="goto" role="group" aria-label="Go to">
        <button data-lz="1.5">Nearby stars</button><button data-lz="3.5">Our arm</button><button data-lz="4.9">Milky Way</button><button data-lz="6.6">Local Group</button><button data-lz="8.4">Supercluster</button><button data-lz="10.7">Universe</button>
      </span>
    </span>
    <span class="seg" id="bright" role="group" aria-label="Brightness">
      <button data-b="lin" title="Light adds up as it is: the crowded centre dominates">Linear</button><button data-b="log" title="Log-compress the light: faint far points show, the bright centre saturates gently">Log</button>
    </span>
    <label id="liftBox" title="How strongly the log brightness lifts faint points">Lift faint <input id="lift" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="Lift faint points"></label>
    <label><input id="ringsOn" type="checkbox" checked> Scale</label>
  </div>
</div>
<footer class="pad" id="foot"></footer>

<script>
(() => {
  const TARGETS = {
    sky: { dir: "sky-spectrum", title: "Electromagnetic Spectrum", views: ["Globe", "Inside", "Map", "Cloud"], wrap: true, lonSign: -1,
      foot: "Drag to turn, scroll or pinch to zoom. Galactic coordinates; the Map has the Galactic Centre in the middle. Bands evenly spaced on the bar, not to scale, each normalised to its own brightness range. The distance window drops light from outside its range." },
    sun: { dir: "sun-spectrum", title: "Sun Spectrum", views: ["Disc"], wrap: false,
      foot: "18 December 2015, 02:44 UTC · Nobeyama 17 GHz, ALMA 1.25 mm, SDO HMI and AIA · solar north up. Scroll or pinch to zoom, drag to pan." },
    earth: { dir: "earth-spectrum", title: "Earth Spectrum", views: ["Globe", "Map"], wrap: true, lonSign: 1,
      foot: "15 June 2024 · MODIS Terra, AMSU-A (NOAA-15), GPM GMI, SMAP, OMI; city lights from 2012. Gaps between orbits are filled from 12–18 June, anything still missing is smoothed in from around it (GMI stops at ±68° latitude); the far south is in polar night. Three bands with no data are modelled and say so: 408 MHz (from SMAP), far-IR and 3–5 µm (from 11 µm)." },
  };
  // fallback region rules for the sky's bands.json, which predates "region"
  const SKY_REGIONS = [
    ["Radio", (b) => ["radio408", "hi21"].includes(b.id)], ["Microwave", (b) => /^p0|^p1|^p2/.test(b.id)],
    ["Far-IR", (b) => ["p353", "p545", "p857", "a160", "a140", "a90", "a65"].includes(b.id)], ["Mid-IR", (b) => /^w/.test(b.id)],
    ["Near-IR", (b) => ["k", "j"].includes(b.id)], ["Visible", (b) => ["rp", "g", "bp"].includes(b.id)],
    ["UV", (b) => b.id === "uv"], ["X-ray", (b) => /^x/.test(b.id)], ["Gamma", (b) => /^gamma/.test(b.id)],
  ];
  const SHORT = { Radio: "Rad", Microwave: "µW", "Far-IR": "FIR", "Mid-IR": "MIR", "Near-IR": "NIR", "Thermal IR": "TIR", Visible: "Vis", "X-ray": "X", Gamma: "γ", EUV: "EUV", UV: "UV" };
  const q = new URLSearchParams(location.search);
  if (q.get("embed") === "1") document.body.classList.add("embed");
  const VIDEO = q.get("video") === "1";
  if (VIDEO) document.body.classList.add("video");
  if (VIDEO && q.get("bar") === "1") document.body.classList.add("bar");
  // opened over the chart (?app=1): room for its close button, and Escape here closes it too
  if (q.get("app") === "1" && window.parent !== window) {
    document.body.classList.add("app");
    addEventListener("keydown", (e) => { if (e.key === "Escape") parent.postMessage({ type: "close-app" }, "*"); });
  }
  let session = null;

  async function boot(target, first) {
    session?.abort();
    session = new AbortController();
    const on = (el, ev, fn, opts = {}) => el.addEventListener(ev, fn, { ...opts, signal: session.signal });
    const T = TARGETS[target];
    document.querySelectorAll("#targets button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.target === target));
    document.getElementById("h1").textContent = T.title;
    document.getElementById("foot").textContent = T.foot;
    const status = document.getElementById("status");
    status.textContent = "Loading…";
    const meta = await (await fetch(`./${T.dir}/bands.json`)).json();
    const B = meta.bands, N = B.length, P = meta.packs.length;
    const hasDepth = !!meta.depth;

    // ---------- spectrum bar ----------
    const slots = document.getElementById("slots"), regions = document.getElementById("regions");
    slots.innerHTML = ""; regions.innerHTML = "";
    B.forEach((b) => {
      const el = document.createElement("div");
      el.className = "slot" + (b.empty ? " empty" : "");
      el.title = `${b.name} · ${b.wave} · ${b.what} · ${b.source}`;
      el.innerHTML = `<span>${b.name.replace(/^(Planck|IRAS|WISE|2MASS|Gaia|AKARI) /, "")}</span>`;
      slots.appendChild(el);
    });
    const regionOf = (b) => b.region ?? SKY_REGIONS.find(([, t]) => t(b))?.[0] ?? "";
    for (let i = 0; i < N;) {
      let j = i;
      while (j < N && regionOf(B[j]) === regionOf(B[i])) j++;
      const el = document.createElement("div");
      el.style.flex = j - i;
      el.textContent = regionOf(B[i]);
      if (SHORT[regionOf(B[i])]) el.dataset.short = SHORT[regionOf(B[i])];
      regions.appendChild(el);
      i = j;
    }

    // ---------- RGB selector: centre c (green) and half-span s, in band units ----------
    const START = meta.start ?? { c: B.findIndex((b) => b.id === "g"), s: 1 };
    let c = first && q.has("c") ? +q.get("c") : START.c, s = first && q.has("s") ? +q.get("s") : START.s;
    const sigma = () => Math.max(0.35, 0.45 * s);
    function weights(p) {
      const w = B.map((_, i) => Math.exp(-((i - p) ** 2) / (2 * sigma() ** 2)));
      const sum = w.reduce((a, b) => a + b, 0);
      return w.map((x, i) => (B[i].empty ? 0 : x / sum)); // empty bands keep their share and read black
    }
    // a band's wavelength in metres, from strings like "73 cm", "330–680 nm", "~1 fm"
    // (a range counts as its geometric mean)
    const UNIT_M = { fm: 1e-15, nm: 1e-9, "µm": 1e-6, mm: 1e-3, cm: 1e-2, m: 1 };
    // the ends of a wavelength string in metres: "21 cm", "330–680 nm", "20 µm–1.5 mm"
    function waveEnds(str) {
      // each side of the dash is "number [unit]"; a side without a unit takes the other's
      const parts = str.replace(/~/g, "").split("–").map((t) => t.trim().match(/^([\d.]+)\s*(fm|nm|µm|mm|cm|m)?$/));
      if (parts.some((m) => !m)) return [NaN, NaN];
      const unit = parts[parts.length - 1][2];
      const [a, b = a] = parts.map((m) => +m[1] * UNIT_M[m[2] ?? unit]);
      return [a, b];
    }
    const waveM = (str) => { const [a, b] = waveEnds(str); return Math.sqrt(a * b); };
    // position on this bar of any wavelength. Each slot owns a range of
    // wavelengths, split at the geometric midpoints between neighbours, except
    // that the visible slots take the colours they play in natural colour:
    // red 600–700 nm, green 500–600, blue 400–500 (Gaia's real passbands are
    // much wider; RP runs to 1,050 nm, which would put near-infrared in red)
    const NATURAL_EDGE = { rp: [700e-9, 600e-9], g: [600e-9, 500e-9], bp: [500e-9, 400e-9] };
    const rep = B.map((b) => Math.log10(waveM(b.wave)));
    const edges = [];   // edges[i]: log wavelength between slot i and i + 1
    for (let i = 0; i < N - 1; i++) {
      const nat = NATURAL_EDGE[B[i].id]?.[1] ?? NATURAL_EDGE[B[i + 1].id]?.[0];
      edges.push(nat ? Math.log10(nat) : (rep[i] + rep[i + 1]) / 2);
    }

      if (t >= 1) { fade = null; return; }
      // the view being left, on top, fading out
      const keep = [view, spinA];
      [view, spinA] = [fade.view, fade.spinA];
      fadeA = fade.a ?? 1 - t * t * (3 - 2 * t);
      renderMode(fade.mode, w, h, dpr);
      [view, spinA] = keep;
      fadeA = 1;
      gl.disable(gl.BLEND);
    }
    function renderMode(mode, w, h, dpr) {
      if (mode === 3 && cloud) {
        gl.useProgram(cloud);
        const U = common(cloud);
        const VP = cloudViewProj(w, h);
        gl.uniform1f(U("size"), DOT * videoDot * Math.min(6 * dpr, Math.max(1.5, 2.2 * dpr * Math.sqrt(view.zoom))));
        // the same points crowd a small view, so each is dimmer there (down to
        // 0.35×), keeping the shells dotted instead of summing to solid white
        const small = Math.max(0.35, Math.min(1, Math.sqrt(w * h) / (700 * dpr)));
        gl.uniform1f(U("dotGain"), small / (DOT * DOT));
        gl.uniform1f(U("spinA"), spinA);
        gl.uniform1i(U("rmode"), rmode);
        // background points in proportion to the selector's weight on bands
        // with a background (at most half, so the foreground keeps enough points)
        const wsum = (k) => weights(c - s)[k] + weights(c)[k] + weights(c + s)[k];
        let wc = 0, wall = 0;
        KINDS.forEach((kd, k) => { const x = wsum(k); wall += x; if (kd === 3 || kd === 4 || BG_LEVEL[k] > 0) wc += x; });
        gl.uniform1f(U("pCmb"), meta.cmb && wall > 0 ? 0.5 * wc / wall : 0);
        gl.uniform1f(U("lu"), +unit.value);
        gl.uniform1f(U("lz"), lz);
        gl.uniformMatrix4fv(U("viewProj"), false, VP);
        // into the light buffer at full strength; the fade (if any) applies when shown
        const shownA = fadeA;
        if (tonemap) { gl.bindFramebuffer(gl.FRAMEBUFFER, accTarget(w, h)); fadeA = 1; }
        gl.clearColor(0, 0, 0, 0); gl.clear(fadeA < 1 ? gl.DEPTH_BUFFER_BIT : gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        // Earth or Sun first, writing depth, so the points behind are hidden
        const lu = +unit.value, rOf = (L) => (L - lu) / (10.66 - lu);
        const centre = rmode !== 1 ? null : lu < L_EARTH ? 0 : lu < L_SUN ? 1 : null;
        gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(true);
        if (centre !== null) {
          const rO = rOf(centre === 0 ? L_EARTH : L_SUN);
          drawCentre(centre, VP, w, h, rO, rO * h * view.zoom / 3.2 / Math.tan(20 * Math.PI / 180), spinA);
        }
        gl.depthMask(false);
        gl.useProgram(cloud);
        additive();
        gl.drawArrays(gl.POINTS, 0, CLOUD_N);
        gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST); gl.depthMask(true);
        if (tonemap) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          fadeA = shownA;
          gl.useProgram(tonemap);
          gl.activeTexture(gl.TEXTURE0 + ACC_UNIT);
          gl.bindTexture(gl.TEXTURE_2D, accTex);
          gl.uniform1i(gl.getUniformLocation(tonemap, "acc"), ACC_UNIT);
          const v = brightLog ? +lift.value : 0;
          gl.uniform1f(gl.getUniformLocation(tonemap, "lift"), v > 0 ? 10 ** (3 * v) - 1 : 0);
          over();
          gl.drawArrays(gl.TRIANGLES, 0, 3);
          gl.disable(gl.BLEND);
        }
        // circles and discs are guides, not light: drawn after the tone map
        if (shownA >= 1) drawRings(VP, w, h, centre);
        return;
      }
      if (fadeA >= 1) ringLabels.hidden = ringText.hidden = true;
      gl.useProgram(quad);
      const U = common(quad);
      const aspect = meta.width / meta.height;
      // the Sun's sky fills the view, cropping the map's top and bottom or sides
      if (mode === 2 && explore === "sun") {
        view.zoom = Math.max(view.zoom, Math.max(w / aspect, h) / Math.min(w / aspect, h));
        const lim = Math.max(0, 0.5 - 0.5 * h / (Math.min(w / aspect, h) * view.zoom));
        view.panY = Math.max(-lim, Math.min(lim, view.panY ?? 0));
      }
      gl.uniform2f(U("res"), w, h);
      gl.uniform1i(U("mode"), mode);
      gl.uniform1f(U("yaw"), view.yaw); gl.uniform1f(U("pitch"), view.pitch); gl.uniform1f(U("zoom"), view.zoom);
      gl.uniform1f(U("orbit"), view.orbit ?? 0);
      gl.uniform1f(U("aspect"), aspect);
      gl.uniform1f(U("panX"), view.panX ?? 0); gl.uniform1f(U("panY"), view.panY ?? 0);
      // mip level from texels per screen pixel, so nothing shimmers
      const pxPerTex = mode === 0 ? (view.zoom * h / 2) / (meta.width / (2 * Math.PI)) : mode === 1 ? (h / 2 / view.zoom) / (meta.width / (2 * Math.PI))
        : (Math.min(w / aspect, h) * view.zoom * aspect) / meta.width;
      gl.uniform1f(U("lod"), Math.max(0, -Math.log2(pxPerTex)));
      over();
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      if (mode === 1 && earthGlobe) drawCentre(0, insideViewProj(w, h), w, h, 1, h * Math.tan(EARTH_INSIDE) / view.zoom, 0);
      if (mode === 2 && explore === "sun" && sunFlat) {
        const E = objUniforms(sunFlat, 1), rad = 0.26 * Math.min(w, h);
        gl.uniform2f(E("cen"), w / 2, h / 2); gl.uniform1f(E("rad"), rad);
        gl.uniform1f(E("slod"), Math.max(0, Math.log2(1024 / (2 * rad))));
        gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
        gl.disable(gl.BLEND);
      }
    }
    let last = performance.now();
    const tick = (now) => {
      if (session.signal.aborted) return;
      const dt = (now - last) / 1000; last = now;
      if (spin && mode === 0) { view.yaw += dt * 0.08; draw(); }
      if (spin && mode === 3) { spinA += dt * 0.06; draw(); }
      else if (fade && fade.a == null) draw();
      if (glide) {
        const t = Math.min(1, (now - glide.t0) / glide.ms), e = t * t * (3 - 2 * t);
        lz = glide.from + (glide.to - glide.from) * e;
        if (t >= 1) glide = null;
        showScale(); draw();
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    on(window, "resize", () => { layoutSelector(); layoutDist(); draw(); });

    if (first && q.has("view")) {
      const want = q.get("view")[0].toUpperCase() + q.get("view").slice(1);
      if (T.views.includes(want)) mode = VIEW_ID[want];
    }
    setMode(mode);
    if (first && q.has("zoom")) { const [lo, hi] = ZOOM[mode]; view.zoom = Math.max(lo, Math.min(hi, +q.get("zoom"))); }
    setRadius(rmode);
    setBright(brightLog);
    // Earth · Sun · Galaxy · Universe: the four ways in (an old ?view= link keeps its view)
    if (hasDepth && !(first && q.has("view"))) setExplore(first && EXPLORE_FOOT[q.get("mode")] ? q.get("mode") : "earth", true);
    else markExplore();
    clamp(); layoutSelector(); layoutDist(); draw();
    // ---------- narrated videos (?video=1) ----------
    // The narration sets the whole state each frame, as a pure function of its
    // audio time, so a render can step frame by frame. Every field is optional:
    //   view "inside" | "cloud" · c, s (selector, in bands of the sky's bar)
    //   yaw, pitch, zoom (camera) · spinA (the Cloud's turn) · gmst (Earth's turn, rad)
    //   orbit (rad): the camera turned about Earth's axis, Earth and the sky together
    //   ezoom: one camera for Inside and the Cloud (Earth's size as Inside's zoom; with
    //   it, yaw/pitch/orbit mean the same in both, so Earth stays put across a switch)
    //   from, fromA: another view drawn over this one at that alpha (a cross-fade)
    //   radius "custom" | "log" | "linear" · unit (log10 ly) · lz (log10 ly at radius 1)
    //   exposure, contrast · bright "lin" | "log" · lift · rings (bool, or "labelled": only the
    //   rings and discs that have a label in `labels`, no plain power-of-ten rings)
    //   labels: { name: "shown as" } only these ring and marker labels, renamed (null: all);
    //   "edge": a ring at the observable universe's edge; "Earth": a ring on Earth's surface
    //   aurora (0–1): Earth's auroral X-ray ovals, a model (the globe's auroraGlow)
    //   guides (0–1): the rings, discs and their names faded, so the dots show through
    //   names (0–1): the names alone faded (once set, in place of guides) · dot: the dots' size (×), as bright each
    const camFor = (m) => m === 3
      ? { yaw: vcam.yaw, pitch: -vcam.pitch, orbit: vcam.orbit, zoom: (3.2 * Math.tan(20 * Math.PI / 180) * Math.tan(EARTH_INSIDE)) / (earthR() * vcam.ezoom) }
      : { yaw: vcam.yaw, pitch: vcam.pitch, orbit: vcam.orbit, zoom: vcam.ezoom };
    function setVideo(st) {
      if (session.signal.aborted) return false;
      if (st.view != null) {
        const m = VIEW_ID[st.view[0].toUpperCase() + st.view.slice(1)];
        if (m !== undefined && m !== mode) { fade = null; setMode(m); }
      }
      if (st.radius != null && R_NAMES.indexOf(st.radius) >= 0 && R_NAMES.indexOf(st.radius) !== rmode) setRadius(R_NAMES.indexOf(st.radius));
      if (st.unit != null) { if (st.unit < +unit.min) unit.min = st.unit; unit.value = st.unit; }
      if (st.lz != null) { lz = Math.max(LZ_MIN, Math.min(LZ_MAX, st.lz)); glide = null; }
      for (const k of ["yaw", "pitch", "zoom", "orbit"]) if (st[k] != null) view[k] = st[k];
      // one camera for both Earth views: ezoom is Earth's size as Inside's field of view
      // (Cloud: the zoom that shows Earth as big), and the Cloud's pitch is turned to match
      if (st.ezoom != null) vcam = { yaw: st.yaw ?? view.yaw, pitch: st.pitch ?? 0, ezoom: st.ezoom, orbit: st.orbit ?? 0 };
      if (vcam) view = camFor(mode);
      if (st.labels !== undefined) videoLabels = st.labels;
      if (st.guides != null) guideA = Math.max(0, Math.min(1, st.guides));
      if (st.names != null) namesA = Math.max(0, Math.min(1, st.names));
      if (st.guides != null || st.names != null) { ringLabels.style.opacity = guideA; ringText.style.opacity = namesA ?? guideA; }
      if (st.dot != null) videoDot = Math.max(0.5, Math.min(4, st.dot));
      // a cross-fade from another view (st.from) over this one, at alpha st.fromA
      const fm = st.from && VIEW_ID[st.from[0].toUpperCase() + st.from.slice(1)];
      fade = fm != null && fm !== mode && st.fromA > 0 && vcam ? { mode: fm, view: camFor(fm), spinA, a: Math.min(1, st.fromA) } : null;
      if (st.spinA != null) spinA = st.spinA;
      if (st.gmst != null) GMST = st.gmst;
      if (st.exposure != null) exposure.value = st.exposure;
      if (st.contrast != null) contrast.value = st.contrast;
      if (st.bright != null) brightLog = st.bright === "log";
      if (st.lift != null) lift.value = st.lift;
      if (st.rings != null) { ringsOn.checked = !!st.rings; ringsLabelled = st.rings === "labelled"; }
      if (st.aurora != null) auroraA = Math.max(0, Math.min(1, st.aurora));
      if (st.c != null || st.s != null) { c = st.c ?? c; s = st.s ?? s; clamp(); layoutSelector(); }
      showScale(); draw();
      return true;
    }
    // what each channel shows right now (for checking a video's words against its pictures):
    // the bands under red, green and blue, with their shares, for the sky and for Earth
    const mix = () => [["red", c - s], ["green", c], ["blue", c + s]].map(([ch, p]) => {
      const sky = weights(p).map((x, i) => [B[i].name, +x.toFixed(2)]).filter(([, x]) => x > 0.05);
      const ob = OBJ[0], earth = !ob ? [] : objWeights(ob.spans ??= ob.meta.bands.map(barSpan), p, ob.meta.bands.map((b) => (b.id === "lights" ? 1 : 0)))
        .map((x, i) => [ob.meta.bands[i].name, +x.toFixed(2)]).filter(([n, x]) => x > 0.05 && !/Night/.test(n));
      return { ch, sky, earth };
    });
    window.spectrumVideo = { set: setVideo, target, mix };
    window.__stillDone = true;
  }

  document.querySelectorAll("#targets button").forEach((b) => b.addEventListener("click", () => boot(b.dataset.target, false)));
  addEventListener("message", (e) => { if (e.source === parent && e.data?.type === "spectrum-state") window.spectrumVideo?.set(e.data.state); });
  boot(TARGETS[q.get("target")] ? q.get("target") : "sky", true);
})();
</script>
