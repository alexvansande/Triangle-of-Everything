<!doctype html><html><head><meta charset="utf-8"><title>Photo-based rock touch-ups</title><style>body{background:#181225;color:#eee;font:16px system-ui;margin:28px}main{display:grid;grid-template-columns:repeat(2,minmax(320px,1fr));gap:20px}article{background:#41338d;border-radius:14px;padding:20px}section{display:flex;gap:12px}figure{margin:0;flex:1;min-width:0}img{width:100%;aspect-ratio:1;object-fit:contain}figcaption{text-align:center;color:#ddd}a{color:#cfc4ff}p{max-width:850px}</style></head><body><h1>Photo-based rock touch-ups</h1><p>Original cutouts and revised illustrations. Missing dark surfaces are reconstructed from the source photos, with upper-left lighting. Hidden terrain is inferred.</p><main id="cards"></main><script>for(const slug of ['phoebe','253-mathilde','gaspra','ida']){const card=document.createElement('article');card.innerHTML=`<h2>${slug.replaceAll('-',' ')}</h2><section><figure><img src="/content/icons/studies/real-photo-touch-ups/${slug}-before.png"><figcaption>Previous cutout</figcaption></figure><figure><img src="/content/icons/src/${slug}.png"><figcaption>Reconstructed dark side</figcaption></figure></section><p><a href="/content/icons/requests/references/${slug}.jpg">Original spacecraft photo</a> · <a href="/${slug}/">View on chart</a></p>`;document.querySelector('#cards').append(card)}</script></body></html>
