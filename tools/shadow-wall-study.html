<!doctype html><html><head><meta charset="utf-8"><title>Wall shadow study</title>
<style>body{margin:0;background:#171223;color:#eee;font:16px system-ui;padding:28px}h1{font-size:23px}p{color:#c9bfdc}main{display:flex;gap:20px;max-width:1100px}section{flex:1;min-width:0}canvas{width:100%;border-radius:12px}a{color:#c5f58b}</style></head><body>
<h1>Floating in front of a wall</h1><p>Same fixed centre. Hover brings the object toward you and casts a larger, softer, dimmer shadow farther down-right.</p>
<label>Object <select id="subject"><option value="cube">Reference cube</option><option value="1-ml-of-water">1 ml · water droplet</option><option value="1-liter-of-water">1 liter · glass bowl</option><option value="1-tonne-of-water">1 tonne · water tank</option></select></label><main><section><h2>Resting</h2><canvas id="rest" width="640" height="640"></canvas></section><section><h2>Hover</h2><canvas id="hover" width="640" height="640"></canvas></section></main>
<p><a id="download" href="/content/icons/shadow-candidates/wall-studies/cube-shadow.png">Transparent shadow PNG</a> · <a href="/">Shadow studio</a></p>
<script type="module">
import {wallShadowImageGeometry} from '/src/shadow-geometry.js';
const load=src=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src;});
const picker=document.getElementById('subject');const requested=new URLSearchParams(location.search).get('subject');if([...picker.options].some(o=>o.value===requested))picker.value=requested;const subject=picker.value;picker.onchange=()=>{location.search='?subject='+picker.value;};const isCube=subject==='cube';const shadowUrl='/content/icons/shadow-candidates/wall-studies/'+(isCube?'cube-shadow':subject)+'.png';document.getElementById('download').href=shadowUrl;const [cube,shadow]=await Promise.all([load(isCube?'/content/icons/shadow-candidates/wall-studies/cube.png':'/content/icons/'+subject+'.webp'),load(isCube?shadowUrl:'/content/icons/shadows/'+subject+'.webp')]);
const scan=document.createElement('canvas');scan.width=cube.width;scan.height=cube.height;const sc=scan.getContext('2d');sc.drawImage(cube,0,0);const px=sc.getImageData(0,0,cube.width,cube.height).data;
let x0=cube.width,y0=cube.height,x1=0,y1=0;for(let y=0;y<cube.height;y++)for(let x=0;x<cube.width;x++)if(px[(y*cube.width+x)*4+3]>64){x0=Math.min(x,x0);x1=Math.max(x,x1);y0=Math.min(y,y0);y1=Math.max(y,y1);}
if(!isCube){x0=0;y0=0;x1=cube.width-1;y1=cube.height-1;}const tex=document.createElement('canvas');tex.width=tex.height=768;const span=isCube?422:768;tex.getContext('2d').drawImage(shadow,(768-span)/2,(768-span)/2,span,span);
for(const [id,k] of [['rest',1],['hover',1.5]]){const c=document.getElementById(id).getContext('2d');c.fillStyle='#433193';c.fillRect(0,0,640,640);c.strokeStyle='#ffffff0b';for(let n=0;n<640;n+=40){c.beginPath();c.moveTo(n,0);c.lineTo(n,640);c.moveTo(0,n);c.lineTo(640,n);c.stroke();}const g=wallShadowImageGeometry({sx:240,sy:220,r:56,anchorBase:false},k);c.globalAlpha=g.opacity;c.filter=`blur(${g.blur}px)`;c.drawImage(tex,g.x,g.y,g.width,g.height);c.globalAlpha=1;c.filter='none';const s=112*k,ratio=(y1-y0+1)/(x1-x0+1);c.drawImage(cube,x0,y0,x1-x0+1,y1-y0+1,240-s/2,220-s*ratio/2,s,s*ratio);}
</script></body></html>
