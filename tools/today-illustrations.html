<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>October 24 illustration gallery</title>
<style>body{margin:0;background:#171122;color:#eee;font:16px system-ui}header{padding:28px 30px}h1{margin:0 0 10px;font-size:26px}p{color:#c9bfd5}input{padding:12px 16px;border:1px solid #635578;border-radius:8px;background:#292035;color:white;font:inherit;width:min(400px,85%)}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px;padding:0 24px 32px}article{background:#41338d;border-radius:12px;overflow:hidden}h2{font-size:18px;margin:18px 20px 0}.scene{height:400px;position:relative;overflow:hidden;background-image:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:50px 50px}.scene img{position:absolute;pointer-events:none}.art{left:calc(50% - 100px);top:45px;width:200px;height:200px;object-fit:contain}article a{color:#e1d9ff;display:inline-block;margin:12px 20px 20px;font-size:13px}[hidden]{display:none}</style></head>
<body><header><h1>Today’s illustrations <span id="count"></span></h1><p>October 24 · Latest versions with chart shadows; photo-based moons without a custom shadow use the standard sphere preview. Stonehenge uses option A and its custom circular shadow.</p><input id="search" type="search" placeholder="Find an object…" aria-label="Find an object"></header><main id="cards"></main>
<script type="module">
import {wallShadowImageGeometry} from '/src/shadow-geometry.js';
const [subjects,overrides,roundNames]=await Promise.all(['/tools/today-illustrations.json','/content/icons/shadows/overrides.json','/content/icons/shadows/round.json'].map(u=>fetch(u).then(r=>r.json())));
const provenance=await fetch('/content/icons/provenance-2026-10-24.json').then(r=>r.json());
const round=new Set([...roundNames,...["55-cnc-e","ariel","charon","dione","iapetus","k2-18-b","kelt-9-b","miranda","oberon","rhea","tethys","titania","trappist-1-e","umbriel","wasp-12-b","wasp-39-b"]]);document.querySelector('#count').textContent=`— ${subjects.length}`;
for(const slug of subjects){const card=document.createElement('article');card.dataset.slug=slug;const settings=round.has(slug)?{mode:'shared'}:overrides[slug]||{};const g=wallShadowImageGeometry({sx:0,sy:145,r:100,registered:settings.registered||settings.mode==='long',round:settings.mode==='shared',anchorBase:settings.anchorBase,roundOffsetScale:settings.roundOffsetScale});card.innerHTML=`<h2>${slug==='stonehenge'?'Stonehenge · selected option A':slug.replaceAll('-',' ')}</h2><p style="margin:8px 20px;font-size:12px">${provenance[slug]?.category||''}</p><div class="scene"><img class="shadow" alt="" src="/content/icons/shadows/${round.has(slug)?'_sphere':slug}.webp" style="left:calc(50% + ${g.x}px);top:${g.y}px;width:${g.width}px;height:${g.height}px;opacity:${g.opacity}"><img class="art" alt="${slug}" src="/content/icons/resolutions/512/${slug}.webp"></div><a href="/content/icons/src/${slug}.png" target="_blank">Full-resolution image ↗</a>`;document.querySelector('#cards').append(card)}
document.querySelector('#search').addEventListener('input',e=>{const q=e.target.value.toLowerCase().replaceAll(' ','-');for(const c of document.querySelectorAll('article'))c.hidden=!c.dataset.slug.includes(q)});
</script></body></html>
