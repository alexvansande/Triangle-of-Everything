<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sky Spectrum</title>
<!--
  The sky, the Sun or the Earth seen through a movable RGB "eye". Each target
  is a set of single-band maps (radio → gamma), each normalised to 0…1:
    npm run build:sky-spectrum · build:sun-spectrum · build:earth-spectrum
  The rainbow selector on the spectrum bar places the red, green and blue
  channels: slide it to shift all three along the spectrum, drag its ends to
  spread them. Each channel is a soft (Gaussian) average of the bands near its
  position, wider as the selector stretches; weights sum to one, so brightness
  stays even. Bands are evenly spaced on the bar, not to scale.
  Sky only: a distance window drops every band's light whose depth (where
  along the line of sight it comes from) falls outside it, in every view.
  Then:  npm run dev  →  http://localhost:5173/tools/sky-spectrum.html
  Cloud radius: Custom (Milky Way on the inner 80%, log; the rest on the outer
  20%), Log (radius ∝ log distance in units from 1,000 km to billions of ly;
  anything nearer than one unit is hidden; with a unit below Earth's radius,
  Earth is drawn at the centre, as now: axis to the pole, turned and sunlit;
  between Earth's and the Sun's radius, the Sun; both in the selector's
  wavelengths) or Linear (radius ∝ distance, where zooming moves the scale
  through powers of ten). Rings mark distances: orbits in the ecliptic, stars
  and galaxies in the galactic plane (?rings=0 hides them).
  ?target=sky|sun|earth  ?view=globe|inside|map|cloud  ?c=&s=  ?dlo=&dhi=
  ?radius=custom|log|linear  ?unit= (log10 ly)  ?lz= (log10 ly at radius 1)  ?zoom=
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono&display=swap">
<style>
  /* One dark instrument: spectrum and distance bars on top, the view filling the rest. */
  :root {
    --sky: #000; --fg: #e9ecf5; --dim: #8f95ab; --line: rgba(205, 215, 255, 0.14); --panel: #0b0d15;
    --display: "Instrument Serif", Georgia, serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
    color-scheme: dark;
  }
  html, body { margin: 0; height: 100%; background: var(--sky); color: var(--fg); font: 13px/1.35 var(--body); }
  body { display: flex; flex-direction: column; overflow: hidden; }
  .pad { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  header { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; padding-top: calc(10px + env(safe-area-inset-top, 0px)); padding-bottom: 4px; }
  header h1 { margin: 0; font: 400 30px/1 var(--display); }
  header p { margin: 0; color: var(--dim); }
  .controls { margin-left: auto; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .controls label { color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
  .controls input[type=range] { width: 96px; accent-color: var(--fg); }
  button { background: #191d2b; color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; font: inherit; cursor: pointer; }
  button:focus-visible, input:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; }
  .seg button:first-child { border-radius: 6px 0 0 6px; } .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button[aria-pressed="true"] { background: var(--fg); color: var(--sky); }

  /* spectrum bar: equal slots, regions above, selector on top; fits the width */
  #bar { position: relative; user-select: none; touch-action: none; margin-top: 4px; }
  #regions { display: flex; height: 18px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); }
  #regions div { border-left: 1px solid var(--line); padding-left: 4px; overflow: hidden; white-space: nowrap; min-width: 0; }
  #slots { display: flex; height: 64px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; position: relative; }
  #slots .slot { flex: 1; border-left: 1px solid var(--line); position: relative; min-width: 0; }
  #slots .slot:first-child { border-left: 0; }
  #slots .slot span { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%) rotate(180deg);
    writing-mode: vertical-rl; white-space: nowrap; max-height: 56px; overflow: hidden; text-overflow: ellipsis; font-size: 9.5px; color: var(--dim); }
  #slots .slot.empty { background: repeating-linear-gradient(45deg, transparent 0 4px, rgba(255,255,255,0.05) 4px 8px); }
  #curves { position: absolute; left: 0; top: 18px; width: 100%; height: 64px; pointer-events: none; }
  .win { position: absolute; border-radius: 6px; cursor: grab; touch-action: none; box-shadow: 0 0 0 1.5px rgba(255,255,255,0.8) inset; }
  .win:active { cursor: grabbing; }
  .win .grip { position: absolute; top: 0; bottom: 0; width: 22px; cursor: ew-resize; }
  .win .grip::after { content: ""; position: absolute; top: 25%; bottom: 25%; left: 9px; width: 4px; border-radius: 2px; background: #fff; }
  .win .grip.a { left: -11px; } .win .grip.b { right: -11px; }
  #selector { top: 18px; height: 64px; background: linear-gradient(90deg, rgba(255,40,40,0.38), rgba(40,255,60,0.38), rgba(60,90,255,0.38)); }
  #readout { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; height: 1.3em; padding: 5px 0 2px; font: 11.5px/1.3 var(--mono); }
  #readout .ch { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* distance bar (sky only) */
  #dist { position: relative; height: 44px; margin-top: 4px; user-select: none; touch-action: none; }
  #dist[hidden] { display: none; }
  #dtrack { position: absolute; left: 0; right: 0; top: 14px; height: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .zone { position: absolute; top: 0; height: 13px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim);
    border-left: 1px solid var(--line); padding-left: 4px; white-space: nowrap; overflow: hidden; }
  .dtick { position: absolute; top: 33px; font: 10px var(--mono); color: var(--dim); transform: translateX(-50%); white-space: nowrap; }
  #dwin { top: 14px; height: 18px; background: rgba(255,255,255,0.14); }
  #dreadout { height: 1.3em; padding: 0 0 2px; font: 11.5px/1.3 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--dim); }
  #dreadout[hidden] { display: none; }

  #stage { flex: 1; min-height: 0; position: relative; margin-top: 4px; }
  #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; display: block; }
  #views { position: absolute; top: 8px; right: max(16px, env(safe-area-inset-right, 0px)); z-index: 1; }
  #status { color: var(--dim); font-size: 12px; }
  /* Cloud radius scale: bottom-left of the view */
  #radius { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: 8px; z-index: 1; display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    max-width: calc(100% - 32px); font-size: 12px; color: var(--dim); }
  #radius[hidden], #radius [hidden] { display: none; }
  #radius label { display: inline-flex; gap: 6px; align-items: center; }
  #radius input[type=range] { width: 160px; accent-color: var(--fg); }
  #radius output { font-family: var(--mono); color: var(--fg); white-space: nowrap; }
  #rings { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #rings div { position: absolute; font: 10.5px/1 var(--mono); color: rgba(233, 236, 245, 0.7); white-space: nowrap; transform: translate(4px, -50%);
    text-shadow: 0 0 3px #000, 0 0 3px #000; }
  #rings div.ecl { color: rgba(255, 214, 140, 0.8); } #rings div.gal { color: rgba(160, 200, 255, 0.8); }
  footer { padding-bottom: calc(6px + env(safe-area-inset-bottom, 0px)); color: var(--dim); font-size: 11px; }
  @media (max-width: 700px) {
    header h1 { font-size: 24px; } header p { display: none; } .controls { margin-left: 0; gap: 8px; }
    .controls input[type=range] { width: 70px; }
    #slots .slot span { display: none; }   /* too narrow for names: the readout names the bands */
    #slots { height: 48px; } #selector, #curves { height: 48px; }
    #regions { font-size: 9px; letter-spacing: 0; }
    #regions div[data-short]::before { content: attr(data-short); } #regions div[data-short] { font-size: 0; }
    #regions div[data-short]::before { font-size: 9px; }
    .zone { font-size: 8.5px; }
    #readout { gap: 8px; font-size: 10.5px; }
  }
</style>
</head>
<body>
<header class="pad">
  <h1 id="h1">Sky Spectrum</h1>
  <p id="sub">Slide the rainbow to see with different eyes. Drag its ends to stretch it.</p>
  <div class="controls">
    <span class="seg" id="targets" role="group" aria-label="Target">
      <button data-target="sky" aria-pressed="true">Sky</button><button data-target="sun" aria-pressed="false">Sun</button><button data-target="earth" aria-pressed="false">Earth</button>
    </span>
    <label>Exposure <input id="exposure" type="range" min="0.3" max="3" step="0.01" value="1"></label>
    <label>Contrast <input id="contrast" type="range" min="0.4" max="2.5" step="0.01" value="1"></label>
    <button id="reset">Natural colour</button>
    <span id="status" role="status">Loading…</span>
  </div>
</header>
<div class="pad">
  <div id="bar">
    <div id="regions"></div>
    <div id="slots"></div>
    <canvas id="curves"></canvas>
    <div id="selector" class="win" tabindex="0" aria-label="RGB selector: arrows move it, shift+arrows stretch it"><div class="grip a"></div><div class="grip b"></div></div>
  </div>
  <div id="readout"></div>
  <div id="dist" hidden>
    <div id="zones"></div>
    <div id="dtrack"></div>
    <div id="dwin" class="win" tabindex="0" aria-label="Distance window: arrows move it, shift+arrows stretch it"><div class="grip a"></div><div class="grip b"></div></div>
    <div id="dticks"></div>
  </div>
  <div id="dreadout" hidden></div>
</div>
<div id="stage">
  <div id="rings"></div>
  <div id="views" class="seg" role="group" aria-label="View"></div>
  <div id="radius" hidden>
    <span class="seg" id="rmodes" role="group" aria-label="Radius scale">
      <button data-r="0" title="Milky Way on the inner 80% (log), everything beyond on the outer 20%">Custom</button><button data-r="1" title="Radius grows with log distance from the chosen unit">Log</button><button data-r="2" title="Radius proportional to distance; zoom moves through powers of ten">Linear</button>
    </span>
    <label id="unitBox">1 unit <input id="unit" type="range" min="-10" max="10" step="0.01" value="0" aria-label="Log scale unit"> <output id="unitOut"></output></label>
    <span id="linBox">radius 1 = <output id="linOut"></output> · scroll or pinch to zoom</span>
    <label><input id="ringsOn" type="checkbox" checked> Rings</label>
  </div>
</div>
<footer class="pad" id="foot"></footer>

<script>
(() => {
  const TARGETS = {
    sky: { dir: "sky-spectrum", title: "Sky Spectrum", views: ["Globe", "Inside", "Map", "Cloud"], wrap: true, lonSign: -1,
      foot: "Drag to turn, scroll or pinch to zoom. Galactic coordinates; the Map has the Galactic Centre in the middle. Bands evenly spaced on the bar, not to scale, each normalised to its own brightness range. The distance window drops light from outside its range." },
    sun: { dir: "sun-spectrum", title: "Sun Spectrum", views: ["Disc"], wrap: false,
      foot: "18 December 2015, 02:44 UTC · Nobeyama 17 GHz, ALMA 1.25 mm, SDO HMI and AIA · solar north up. Scroll or pinch to zoom, drag to pan." },
    earth: { dir: "earth-spectrum", title: "Earth Spectrum", views: ["Globe", "Map"], wrap: true, lonSign: 1,
      foot: "15 June 2024 · MODIS Terra, GPM GMI, OMI; city lights from 2012. One day of polar orbits: black wedges are gaps between passes, the far south is in polar night." },
  };
  // fallback region rules for the sky's bands.json, which predates "region"
  const SKY_REGIONS = [
    ["Radio", (b) => ["radio408", "hi21"].includes(b.id)], ["Microwave", (b) => /^p0|^p1|^p2/.test(b.id)],
    ["Far-IR", (b) => ["p353", "p545", "p857", "a160", "a140", "a90", "a65"].includes(b.id)], ["Mid-IR", (b) => /^w/.test(b.id)],
    ["Near-IR", (b) => ["k", "j"].includes(b.id)], ["Visible", (b) => ["rp", "g", "bp"].includes(b.id)],
    ["UV", (b) => b.id === "uv"], ["X-ray", (b) => /^x/.test(b.id)], ["Gamma", (b) => /^gamma/.test(b.id)],
  ];
  const SHORT = { Radio: "Rad", Microwave: "µW", "Far-IR": "FIR", "Mid-IR": "MIR", "Near-IR": "NIR", "Thermal IR": "TIR", Visible: "Vis", "X-ray": "X", Gamma: "γ", EUV: "EUV", UV: "UV" };
  const q = new URLSearchParams(location.search);
  let session = null;

  async function boot(target, first) {
    session?.abort();
    session = new AbortController();
    const on = (el, ev, fn, opts = {}) => el.addEventListener(ev, fn, { ...opts, signal: session.signal });
    const T = TARGETS[target];
    document.querySelectorAll("#targets button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.target === target));
    document.getElementById("h1").textContent = T.title;
    document.getElementById("foot").textContent = T.foot;
    const status = document.getElementById("status");
    status.textContent = "Loading…";
    const meta = await (await fetch(`./${T.dir}/bands.json`)).json();
    const B = meta.bands, N = B.length, P = meta.packs.length;
    const hasDepth = !!meta.depth;

    // ---------- spectrum bar ----------
    const slots = document.getElementById("slots"), regions = document.getElementById("regions");
    slots.innerHTML = ""; regions.innerHTML = "";
    B.forEach((b) => {
      const el = document.createElement("div");
      el.className = "slot" + (b.empty ? " empty" : "");
      el.title = `${b.name} · ${b.wave} · ${b.what} · ${b.source}`;
      el.innerHTML = `<span>${b.name.replace(/^(Planck|IRAS|WISE|2MASS|Gaia|AKARI) /, "")}</span>`;
      slots.appendChild(el);
    });
    const regionOf = (b) => b.region ?? SKY_REGIONS.find(([, t]) => t(b))?.[0] ?? "";
    for (let i = 0; i < N;) {
      let j = i;
      while (j < N && regionOf(B[j]) === regionOf(B[i])) j++;
      const el = document.createElement("div");
      el.style.flex = j - i;
      el.textContent = regionOf(B[i]);
      if (SHORT[regionOf(B[i])]) el.dataset.short = SHORT[regionOf(B[i])];
      regions.appendChild(el);
      i = j;
    }

    // ---------- RGB selector: centre c (green) and half-span s, in band units ----------
    const START = meta.start ?? { c: B.findIndex((b) => b.id === "g"), s: 1 };
    let c = first && q.has("c") ? +q.get("c") : START.c, s = first && q.has("s") ? +q.get("s") : START.s;
    const sigma = () => Math.max(0.35, 0.45 * s);
    function weights(p) {
      const w = B.map((_, i) => Math.exp(-((i - p) ** 2) / (2 * sigma() ** 2)));
      const sum = w.reduce((a, b) => a + b, 0);
      return w.map((x, i) => (B[i].empty ? 0 : x / sum)); // empty bands keep their share and read black
    }
    // a band's wavelength in metres, from strings like "73 cm", "330–680 nm", "~1 fm"
    // (a range counts as its geometric mean)
    const UNIT_M = { fm: 1e-15, nm: 1e-9, "µm": 1e-6, mm: 1e-3, cm: 1e-2, m: 1 };
    function waveM(str) {
      const m = str.replace(/~/g, "").match(/([\d.]+)(?:\s*–\s*([\d.]+))?\s*(fm|nm|µm|mm|cm|m)\b/);
      return m ? Math.sqrt(+m[1] * +(m[2] ?? m[1])) * UNIT_M[m[3]] : NaN;
    }
    // position on this bar of any wavelength: between the two bands around it,
    // in log wavelength (the bar runs from long to short)
    const barLog = B.map((b) => Math.log10(waveM(b.wave)));
    function barPos(m) {
      const x = Math.log10(m);
      if (x >= barLog[0]) return 0;
      for (let i = 0; i < N - 1; i++) if (x >= barLog[i + 1]) return i + (barLog[i] - x) / (barLog[i] - barLog[i + 1]);
      return N - 1;
    }
    // selector weights for another target's bands: a Gaussian at each band's
    // place on the bar; where several crowd under one channel they share it
    function objWeights(pos, p) {
      const g = pos.map((x) => Math.exp(-((x - p) ** 2) / (2 * sigma() ** 2)));
      const sum = g.reduce((a, b) => a + b, 0);
      return g.map((x) => (sum > 1 ? x / sum : x));
    }
    const sel = document.getElementById("selector"), curves = document.getElementById("curves");
    const slotW = () => slots.getBoundingClientRect().width / N;
    function clamp() { s = Math.max(0.25, Math.min((N - 1) / 2, s)); c = Math.max(s, Math.min(N - 1 - s, c)); }
    function drawCurves() {
      const r = slots.getBoundingClientRect(), dpr = devicePixelRatio || 1;
      curves.width = r.width * dpr; curves.height = r.height * dpr;
      const g = curves.getContext("2d");
      g.scale(dpr, dpr);
      [["#ff4a4a", c - s], ["#4aff63", c], ["#5b7cff", c + s]].forEach(([col, p]) => {
        g.beginPath();
        for (let x = 0; x <= r.width; x += 2) {
          const y = r.height - 6 - (r.height - 14) * Math.exp(-((x / slotW() - 0.5 - p) ** 2) / (2 * sigma() ** 2));
          x === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
        }
        g.strokeStyle = col; g.lineWidth = 1.5; g.stroke();
      });
    }
    function readout() {
      const el = document.getElementById("readout");
      el.innerHTML = "";
      [["R", "#ff6b6b", c - s], ["G", "#6bff7f", c], ["B", "#7d97ff", c + s]].forEach(([n, col, p]) => {
        const all = weights(p).map((x, i) => [x, B[i]]);
        const w = all.reduce((a, [x]) => a + x, 0) < 0.05 ? [] : all.filter(([x]) => x > 0.01).sort((a, b) => b[0] - a[0]).slice(0, 3);
        const d = document.createElement("div");
        d.className = "ch";
        d.innerHTML = `<b style="color:${col}">${n}</b> ` + (w.length ? w.map(([x, b]) => `${b.name} ${Math.round(100 * x)}%`).join(" · ") : "<span style='color:var(--dim)'>nothing (no data here)</span>");
        el.appendChild(d);
      });
    }
    function layoutSelector() {
      const w = slotW();
      sel.style.left = `${(c - s + 0.5) * w - 10}px`;
      sel.style.width = `${2 * s * w + 20}px`;
      drawCurves(); readout();
    }
    // drag helper shared by both windows: body moves, grips stretch
    function draggable(el, get, set, unit) {
      let drag = null;
      on(el, "pointerdown", (e) => {
        const g = e.target.closest(".grip");
        drag = { x: e.clientX, v: get(), mode: g ? (g.classList.contains("a") ? "a" : "b") : "move" };
        el.setPointerCapture(e.pointerId); e.preventDefault();
      });
      on(el, "pointermove", (e) => { if (drag) set(drag.v, drag.mode, (e.clientX - drag.x) / unit()); });
      on(el, "pointerup", () => (drag = null));
      on(el, "pointercancel", () => (drag = null));
    }
    draggable(sel, () => ({ c, s }), (v, mode, d) => {
      if (mode === "move") c = v.c + d; else s = v.s + (mode === "b" ? d : -d);
      clamp(); layoutSelector(); draw();
    }, slotW);
    on(sel, "keydown", (e) => {
      const step = e.altKey ? 0.1 : 0.5;
      if (e.key === "ArrowLeft") e.shiftKey ? (s -= step) : (c -= step);
      else if (e.key === "ArrowRight") e.shiftKey ? (s += step) : (c += step);
      else return;
      e.preventDefault(); clamp(); layoutSelector(); draw();
    });
    on(document.getElementById("reset"), "click", () => { c = START.c; s = START.s; layoutSelector(); draw(); });

    // ---------- distance window (sky): log10 ly, light outside is dropped ----------
    const DMIN = 1.5, DMAX = 11;
    let dlo = DMIN, dhi = DMAX;
    if (first && q.has("dlo")) dlo = +q.get("dlo");
    if (first && q.has("dhi")) dhi = +q.get("dhi");
    const dist = document.getElementById("dist"), dwin = document.getElementById("dwin"), dread = document.getElementById("dreadout");
    dist.hidden = dread.hidden = !hasDepth;
    const dW = () => dist.clientWidth;
    const dx = (L) => ((L - DMIN) / (DMAX - DMIN)) * dW();
    function fmtLy(L) {
      const ly = 10 ** L;
      for (const [f, u] of [[1e9, " billion ly"], [1e6, " million ly"], [1e3, ",000 ly"]]) if (ly >= f) return `${+(ly / f).toPrecision(2)}${u}`;
      return `${+ly.toPrecision(2)} ly`;
    }
    if (hasDepth) {
      const zones = document.getElementById("zones"), ticks = document.getElementById("dticks");
      zones.innerHTML = ticks.innerHTML = "";
      [[1.5, 2.6, "Near"], [2.6, 4.8, "Milky Way"], [4.8, 10.3, "Beyond the Galaxy"], [10.3, 11, "CMB"]].forEach(([a, b, n]) => {
        const el = document.createElement("div"); el.className = "zone"; el.textContent = n; el.dataset.a = a; el.dataset.b = b; zones.appendChild(el);
      });
      [[2, "100 ly"], [3, "1k"], [4, "10k"], [6, "1M"], [8, "100M"], [10, "10G ly"]].forEach(([L, t]) => {
        const el = document.createElement("div"); el.className = "dtick"; el.textContent = t; el.dataset.l = L; ticks.appendChild(el);
      });
    }
    function layoutDist() {
      if (!hasDepth) return;
      document.querySelectorAll(".zone").forEach((el) => { el.style.left = `${dx(+el.dataset.a)}px`; el.style.width = `${dx(+el.dataset.b) - dx(+el.dataset.a)}px`; });
      document.querySelectorAll(".dtick").forEach((el) => (el.style.left = `${dx(+el.dataset.l)}px`));
      dwin.style.left = `${dx(dlo)}px`; dwin.style.width = `${Math.max(10, dx(dhi) - dx(dlo))}px`;
      const all = dlo <= DMIN + 0.01 && dhi >= DMAX - 0.01;
      dread.textContent = all ? "Distance: everything (drag the window or its ends to keep only light from some distances)"
        : `Distance: light from ${fmtLy(dlo)} to ${fmtLy(dhi)} only`;
    }
    if (hasDepth) {
      draggable(dwin, () => ({ dlo, dhi }), (v, mode, d) => {
        const w = v.dhi - v.dlo;
        if (mode === "move") { dlo = Math.max(DMIN, Math.min(DMAX - w, v.dlo + d)); dhi = dlo + w; }
        else if (mode === "a") dlo = Math.max(DMIN, Math.min(dhi - 0.1, v.dlo + d));
        else dhi = Math.min(DMAX, Math.max(dlo + 0.1, v.dhi + d));

        if (mode === 3) { view.yaw -= ddx * k * view.zoom; view.pitch = Math.max(-1.5, Math.min(1.5, view.pitch + ddy * k * view.zoom)); }
        else { view.yaw += (mode === 0 ? -ddx : ddx) * k; view.pitch = Math.max(-1.55, Math.min(1.55, view.pitch + (mode === 0 ? -ddy : ddy) * k)); }

      draw();
    });
    const up = (e) => { pts.delete(e.pointerId); pinchD = 0; };
    on(canvas, "pointerup", up); on(canvas, "pointercancel", up);

    // galactic → equatorial (the transpose of the ICRS → galactic rotation),
    // laid out column by column for uniformMatrix3fv
    const GAL_TO_EQ = new Float32Array([
      -0.0548755604, -0.8734370902, -0.4838350155,
      0.4941094279, -0.4448296300, 0.7469822445,
      -0.8676661490, -0.1980763734, 0.4559837762,
    ]);
    // Earth's turn (sidereal angle) and the Sun's direction, for the moment the page opened
    const SKY_NOW = (() => {
      const days = Date.now() / 864e5 + 2440587.5 - 2451545.0;
      const gmst = 2 * Math.PI * ((0.779057273264 + 1.00273781191135448 * days) % 1);
      const rad = Math.PI / 180, g = (357.528 + 0.9856003 * days) * rad;
      const lam = (280.46 + 0.9856474 * days) * rad + (1.915 * Math.sin(g) + 0.02 * Math.sin(2 * g)) * rad, eps = 23.439 * rad;
      return { gmst, sun: [Math.cos(lam), Math.cos(eps) * Math.sin(lam), Math.sin(eps) * Math.sin(lam)] };
    })();
    const L_SUN = Math.log10(696000 / 9.4607e12);
    // reference rings (log10 ly): Earth- and Sun-sized circles, orbits in the
    // ecliptic, then stars, the Galaxy and beyond in the galactic plane
    const KM = (x) => Math.log10(x / 9.4607e12), AU = (x) => Math.log10(x * 1.5813e-5), LYL = (x) => Math.log10(x);
    // [name, log10 ly, plane, label rank: 1 always tried first, 3 only with room]
    const RINGS = [
      ["Earth radius", KM(6371), "ecl", 1], ["Sun radius", L_SUN, "ecl", 1], ["Moon", KM(384400), "ecl", 1],
      ["Mercury", AU(0.387), "ecl", 3], ["Venus", AU(0.723), "ecl", 3], ["1 AU · Earth–Sun", AU(1), "ecl", 1], ["Mars", AU(1.52), "ecl", 3],
      ["Jupiter", AU(5.2), "ecl", 2], ["Saturn", AU(9.58), "ecl", 3], ["Uranus", AU(19.2), "ecl", 3], ["Neptune", AU(30.1), "ecl", 1],
      ["Heliopause", AU(120), "ecl", 2], ["1 light-year", 0, "gal", 1], ["Proxima Centauri", LYL(4.24), "gal", 2], ["Sirius", LYL(8.6), "gal", 3],
      ["Pleiades", LYL(444), "gal", 3], ["Orion Nebula", LYL(1344), "gal", 2], ["Galactic Centre", LYL(26700), "gal", 1], ["Milky Way edge", LYL(5.5e4), "gal", 3],
      ["Large Magellanic Cloud", LYL(1.6e5), "gal", 2], ["Andromeda", LYL(2.5e6), "gal", 1], ["Virgo Cluster", LYL(5.4e7), "gal", 2],
      ["Coma Cluster", LYL(3.2e8), "gal", 3], ["z = 1", 10.03, "gal", 2], ["z = 3", 10.35, "gal", 3], ["CMB", 10.66, "gal", 1],
    ];
    // planes in cloud coordinates (cloud d = galactic (x, z, −y)); the ecliptic
    // pole is at galactic l 96.38°, b 29.81°
    const toCloud = (l, b) => { const r = Math.PI / 180; return [Math.cos(b * r) * Math.cos(l * r), Math.sin(b * r), -Math.cos(b * r) * Math.sin(l * r)]; };
    const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
    const norm = (a) => { const l = Math.hypot(...a); return a.map((x) => x / l); };
    const eclN = toCloud(96.38, 29.81), eclX = norm(cross([0, 1, 0], eclN)), eclY = cross(eclN, eclX);
    const PLANES = { gal: [[1, 0, 0], [0, 0, 1]], ecl: [eclX, eclY] };
    const RING_COL = { gal: [0.16, 0.24, 0.36], ecl: [0.36, 0.28, 0.14] };
    const ringLabels = document.getElementById("rings"), ringsOn = document.getElementById("ringsOn");
    if (first && q.get("rings") === "0") ringsOn.checked = false;
    on(ringsOn, "change", () => draw());
    // radius of a log distance in the current scale, or null when off the chart
    function radiusOf(L) {
      if (rmode === 0) return L < 2 ? null : L <= 4.8 ? 0.8 * (L - 2) / 2.8 : 0.8 + 0.2 * Math.min(1, (L - 4.8) / (10.66 - 4.8));
      if (rmode === 1) { const lu = +unit.value; return L < lu ? null : (L - lu) / (10.66 - lu); }
      const r = 10 ** (L - lz);
      return r > 2.6 || r < 0.004 ? null : r;
    }
    function drawRings(VP, w, h, centre) {
      ringLabels.hidden = !ringsOn.checked;
      if (!ringsOn.checked) return;
      gl.useProgram(ringProg);
      const U = (n) => gl.getUniformLocation(ringProg, n);
      gl.uniformMatrix4fv(U("viewProj"), false, VP);
      gl.uniform1f(U("spinA"), spinA);
      gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
      const cs = Math.cos(spinA), sn = Math.sin(spinA), dpr = w / canvas.getBoundingClientRect().width;
      const project = (p) => {
        const x = cs * p[0] + sn * p[2], y = p[1], z = -sn * p[0] + cs * p[2];
        const cx = VP[0] * x + VP[4] * y + VP[8] * z + VP[12], cy = VP[1] * x + VP[5] * y + VP[9] * z + VP[13], cw = VP[3] * x + VP[7] * y + VP[11] * z + VP[15];
        return cw <= 0 ? null : [(cx / cw * 0.5 + 0.5) * w / dpr, (0.5 - cy / cw * 0.5) * h / dpr];
      };
      const html = [], taken = [], cands = [];
      for (const [name, L, plane, rank] of RINGS) {
        if ((centre === 0 && L === RINGS[0][1]) || (centre === 1 && L === L_SUN)) continue; // the globe or disc is its own outline
        const r = radiusOf(L);
        if (r === null || r <= 0) continue;
        const [ax, ay] = PLANES[plane];
        gl.uniform3fv(U("ax"), ax); gl.uniform3fv(U("ay"), ay); gl.uniform1f(U("r"), r);
        const fade = rmode === 2 ? Math.max(0, Math.min(1, (2.6 - r) / 0.6)) : 1;
        gl.uniform3fv(U("col"), RING_COL[plane].map((x) => x * fade));
        gl.drawArrays(gl.LINE_LOOP, 0, 160);
        // the label sits at the ring's right-most point on screen
        let best = null;
        for (let k = 0; k < 64; k++) {
          const a = (2 * Math.PI * k) / 64, sp = project([0, 1, 2].map((i) => r * (Math.cos(a) * ax[i] + Math.sin(a) * ay[i])));
          if (sp && (!best || sp[0] > best[0])) best = sp;
        }
        if (best && fade > 0.3) cands.push({ name, plane, rank, fade, x: best[0], y: best[1], wd: 6.4 * name.length + 12 });
      }
      // most important first; a label only goes where it overlaps no other
      const W_ = w / dpr, H_ = h / dpr;
      cands.sort((a, b) => a.rank - b.rank);
      for (const c of cands) {
        if (c.x < 0 || c.x + c.wd > W_ - 8 || c.y < 40 || c.y > H_ - 40) continue;
        if (taken.some((t) => Math.abs(t.y - c.y) < 14 && c.x < t.x + t.wd && t.x < c.x + c.wd)) continue;
        taken.push(c);
        html.push(`<div class="${c.plane}" style="left:${c.x.toFixed(1)}px;top:${c.y.toFixed(1)}px;opacity:${c.fade.toFixed(2)}">${c.name}</div>`);
      }
      ringLabels.innerHTML = html.join("");
      gl.disable(gl.BLEND);
    }
    const CAM = { r: [1, 0, 0], u: [0, 1, 0], f: [0, 0, -1] };
    function cloudViewProj(w, h) {
      const dist = 3.2 / view.zoom, cp = Math.cos(view.pitch);
      const eye = [dist * cp * Math.sin(view.yaw), dist * Math.sin(view.pitch), dist * cp * Math.cos(view.yaw)];
      const f = eye.map((x) => -x / dist);
      const sx = [-f[2], 0, f[0]]; // forward × up (0, 1, 0)
      const sl = Math.hypot(...sx); sx.forEach((_, i) => (sx[i] /= sl));
      const u = [sx[1] * f[2] - sx[2] * f[1], sx[2] * f[0] - sx[0] * f[2], sx[0] * f[1] - sx[1] * f[0]];
      CAM.r = sx; CAM.u = u; CAM.f = f;
      const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
      const V = [sx[0], u[0], -f[0], 0, sx[1], u[1], -f[1], 0, sx[2], u[2], -f[2], 0, -dot(sx, eye), -dot(u, eye), dot(f, eye), 1];
      const t = 1 / Math.tan(20 * Math.PI / 180), a = w / h, n = 0.01, fa = 100;
      const Pm = [t / a, 0, 0, 0, 0, t, 0, 0, 0, 0, (fa + n) / (n - fa), -1, 0, 0, (2 * fa * n) / (n - fa), 0];
      const M = new Float32Array(16);
      for (let cc = 0; cc < 4; cc++) for (let r = 0; r < 4; r++) { let sum = 0; for (let k = 0; k < 4; k++) sum += Pm[k * 4 + r] * V[cc * 4 + k]; M[cc * 4 + r] = sum; }
      return M;
    }
    const exposure = document.getElementById("exposure"), contrast = document.getElementById("contrast");
    on(exposure, "input", () => draw()); on(contrast, "input", () => draw());
    let spinA = 0;
    function common(p) {
      const U = (n) => gl.getUniformLocation(p, n);
      const pad = (x) => { const a = new Float32Array(P * 3); a.set(x); return a; };
      gl.uniform1fv(U("wR"), pad(weights(c - s)));
      gl.uniform1fv(U("wG"), pad(weights(c)));
      gl.uniform1fv(U("wB"), pad(weights(c + s)));
      gl.uniform1f(U("gain"), +exposure.value);
      gl.uniform1f(U("gam"), +contrast.value);
      gl.uniform1f(U("dLo"), dlo <= DMIN + 0.01 ? -99 : dlo);
      gl.uniform1f(U("dHi"), dhi >= DMAX - 0.01 ? 99 : dhi);
      gl.uniform1i(U("useDepth"), hasDepth ? 1 : 0);
      gl.uniform1f(U("lonSign"), T.lonSign ?? 0);
      return U;
    }
    function draw() {
      if (session.signal.aborted) return;
      const r = canvas.getBoundingClientRect(), dpr = Math.min(devicePixelRatio || 1, 2);
      const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
      if (canvas.width !== w || canvas.height !== h) { canvas.width = w; canvas.height = h; }
      gl.viewport(0, 0, w, h);
      if (mode === 3 && cloud) {
        gl.useProgram(cloud);
        const U = common(cloud);
        const VP = cloudViewProj(w, h);
        gl.uniform1f(U("size"), Math.min(6 * dpr, Math.max(1.5, 2.2 * dpr * Math.sqrt(view.zoom))));
        gl.uniform1f(U("spinA"), spinA);
        gl.uniform1i(U("rmode"), rmode);
        gl.uniform1f(U("lu"), +unit.value);
        gl.uniform1f(U("lz"), lz);
        gl.uniformMatrix4fv(U("viewProj"), false, VP);
        gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        // Earth or Sun first, writing depth, so the points behind are hidden
        const lu = +unit.value, rOf = (L) => (L - lu) / (10.66 - lu);
        const centre = rmode !== 1 ? null : lu < L_EARTH ? 0 : lu < L_SUN ? 1 : null;
        gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.depthMask(true);
        if (centre !== null) {
          const p = centre === 0 ? earthGlobe : sunDisc, ob = OBJ[centre];
          gl.useProgram(p);
          const E = (n) => gl.getUniformLocation(p, n);
          const pos = ob.pos ??= ob.meta.bands.map((b) => barPos(waveM(b.wave)));
          const pad = (x) => { const a = new Float32Array(OBJ_MAX); a.set(x); return a; };
          gl.uniform1fv(E("oR"), pad(objWeights(pos, c - s)));
          gl.uniform1fv(E("oG"), pad(objWeights(pos, c)));
          gl.uniform1fv(E("oB"), pad(objWeights(pos, c + s)));
          gl.uniform1f(E("gain"), +exposure.value); gl.uniform1f(E("gam"), +contrast.value);
          gl.uniformMatrix4fv(E("viewProj"), false, VP);
          gl.uniform2f(E("res"), w, h);
          const rO = rOf(centre === 0 ? L_EARTH : L_SUN);
          const px = rO * h * view.zoom / 3.2 / Math.tan(20 * Math.PI / 180); // rough screen radius
          if (centre === 0) {
            gl.uniformMatrix3fv(E("galToEq"), false, GAL_TO_EQ);
            gl.uniform3fv(E("sunEq"), SKY_NOW.sun);
            gl.uniform1f(E("rE"), rO); gl.uniform1f(E("spinA"), spinA); gl.uniform1f(E("gmst"), SKY_NOW.gmst);
            gl.uniform1f(E("elod"), Math.max(0, Math.log2(2048 / Math.max(1, 3 * px))));
            const LIT = { gmi: 0, t11: 0, lights: 2 };
            gl.uniform1iv(E("lit"), Int32Array.from({ length: OBJ_MAX }, (_, k) => ob.meta.bands[k] ? LIT[ob.meta.bands[k].id] ?? 1 : 0));
          } else {
            gl.uniform3fv(E("camR"), CAM.r); gl.uniform3fv(E("camU"), CAM.u); gl.uniform3fv(E("camF"), CAM.f);
            gl.uniform1f(E("rS"), rO);
            gl.uniform1f(E("slod"), Math.max(0, Math.log2(1024 / Math.max(1, 2.7 * px))));
          }
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
        gl.depthMask(false);
        drawRings(VP, w, h, centre);
        gl.useProgram(cloud);
        gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE);
        gl.drawArrays(gl.POINTS, 0, CLOUD_N);
        gl.disable(gl.BLEND); gl.disable(gl.DEPTH_TEST); gl.depthMask(true);
        return;
      }
      ringLabels.hidden = true;
      gl.useProgram(quad);
      const U = common(quad);
      const aspect = meta.width / meta.height;
      gl.uniform2f(U("res"), w, h);
      gl.uniform1i(U("mode"), mode);
      gl.uniform1f(U("yaw"), view.yaw); gl.uniform1f(U("pitch"), view.pitch); gl.uniform1f(U("zoom"), view.zoom);
      gl.uniform1f(U("aspect"), aspect);
      gl.uniform1f(U("panX"), view.panX ?? 0); gl.uniform1f(U("panY"), view.panY ?? 0);
      // mip level from texels per screen pixel, so nothing shimmers
      const pxPerTex = mode === 0 ? (view.zoom * h / 2) / (meta.width / (2 * Math.PI)) : mode === 1 ? (h / 2 / view.zoom) / (meta.width / (2 * Math.PI))
        : (Math.min(w / aspect, h) * view.zoom * aspect) / meta.width;
      gl.uniform1f(U("lod"), Math.max(0, -Math.log2(pxPerTex)));
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    let last = performance.now();
    const tick = (now) => {
      if (session.signal.aborted) return;
      const dt = (now - last) / 1000; last = now;
      if (spin && mode === 0) { view.yaw += dt * 0.08; draw(); }
      if (spin && mode === 3) { spinA += dt * 0.06; draw(); }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
    on(window, "resize", () => { layoutSelector(); layoutDist(); draw(); });

    if (first && q.has("view")) {
      const want = q.get("view")[0].toUpperCase() + q.get("view").slice(1);
      if (T.views.includes(want)) mode = VIEW_ID[want];
    }
    setMode(mode);
    if (first && q.has("zoom")) { const [lo, hi] = ZOOM[mode]; view.zoom = Math.max(lo, Math.min(hi, +q.get("zoom"))); }
    setRadius(rmode);
    clamp(); layoutSelector(); layoutDist(); draw();
    window.__stillDone = true;
  }

  document.querySelectorAll("#targets button").forEach((b) => b.addEventListener("click", () => boot(b.dataset.target, false)));
  boot(TARGETS[q.get("target")] ? q.get("target") : "sky", true);
})();
</script>
