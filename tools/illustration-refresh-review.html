<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Illustration refresh · October 22</title>
<style>body{margin:0;background:#171322;color:#eee8fa;font:16px system-ui}header{position:sticky;top:0;z-index:2;padding:18px 24px;background:#171322ee;border-bottom:1px solid #514268;backdrop-filter:blur(10px)}h1{font-size:22px;margin:0 0 8px}p{margin:5px 0;color:#bdb2ce}input,button{font:inherit;padding:8px;border:1px solid #786992;border-radius:6px;background:#292237;color:inherit}label{margin-left:15px}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:16px;padding:24px}article{background:#211b2e;border-radius:12px;overflow:hidden;border:1px solid #493a5b}canvas{width:100%;aspect-ratio:1;display:block}footer{padding:10px 15px}footer b{display:block;text-transform:capitalize}a{color:#c2f78b}small{color:#aaa0bb}</style>
<header><h1>Refreshed miniature collection</h1><p id="summary">Loading…</p><input id="filter" placeholder="Find an illustration" aria-label="Find an illustration"><label><input id="hoverAll" type="checkbox"> Hover all</label><label><input id="shadows" type="checkbox" checked> Shadows</label><p>Move over an object to compare its hover state. Any blocked requests are listed below.</p></header><main></main>
<script type="module">
import {wallShadowImageGeometry} from '/src/shadow-geometry.js';
const q=await(await fetch('/docs/illustration-refresh-queue.json')).json(),settings=await(await fetch('/content/icons/shadows/overrides.json')).json();
const listed=[...q.refresh,...q.new];const items=[...listed,...(q.followups||[]).filter(i=>!listed.some(x=>x.slug===i.slug))],cards=[];
const image=src=>new Promise((resolve,reject)=>{const im=new Image;im.onload=()=>resolve(im);im.onerror=reject;im.src=src});
document.querySelector('#summary').textContent=`${items.filter(i=>i.status==='complete').length} complete · ${items.filter(i=>i.status==='generation-blocked').length} blocked by image service. Originals preserved.`;
for(const item of items){const el=document.createElement('article'),canvas=document.createElement('canvas');canvas.width=canvas.height=640;el.append(canvas);const footer=document.createElement('footer'),title=document.createElement('b');title.textContent=item.slug.replaceAll('-',' ');footer.append(title);const a=document.createElement('a');a.textContent='Adjust shadow ↗';a.href='http://127.0.0.1:5190/?icon='+item.slug;a.target='_blank';footer.append(a);const note=document.createElement('small');note.style.display='block';note.textContent=item.status==='generation-blocked'?'Generation blocked · previous artwork retained when available':(q.new.some(i=>i.slug===item.slug)?'New illustration':'Refreshed illustration');footer.append(note);el.append(footer);document.querySelector('main').append(el);const card={el,canvas,slug:item.slug,hover:false};cards.push(card);canvas.onpointerenter=()=>{card.hover=true;draw(card)};canvas.onpointerleave=()=>{card.hover=false;draw(card)};Promise.allSettled([image('/content/icons/resolutions/512/'+item.slug+'.webp'),image('/content/icons/shadows/'+item.slug+'.webp')]).then(r=>{card.icon=r[0].value;card.shadow=r[1].value;draw(card)});}
function draw(card){const c=card.canvas.getContext('2d');c.fillStyle='#433193';c.fillRect(0,0,640,640);c.strokeStyle='#ffffff0b';for(let n=0;n<640;n+=40){c.beginPath();c.moveTo(n,0);c.lineTo(n,640);c.moveTo(0,n);c.lineTo(640,n);c.stroke()}const growth=card.hover||document.querySelector('#hoverAll').checked?1.5:1,body=215,s=settings[card.slug]||{},g=wallShadowImageGeometry({sx:270,sy:255,r:body/2,registered:s.registered||s.mode==='long',anchorBase:s.anchorBase},growth);if(card.shadow&&document.querySelector('#shadows').checked){c.globalAlpha=g.opacity;c.filter=`blur(${g.blur}px)`;c.drawImage(card.shadow,g.x+body*.1,g.y+body*.1,g.width,g.height);c.globalAlpha=1;c.filter='none'}if(card.icon)c.drawImage(card.icon,270-body*growth/2,255-body*growth/2,body*growth,body*growth);else{c.fillStyle='#ddd';c.font='20px system-ui';c.fillText('No replacement available',190,260)}}
document.querySelector('#filter').oninput=e=>cards.forEach(x=>x.el.hidden=!x.slug.includes(e.target.value.toLowerCase().replaceAll(' ','-')));
for(const id of ['hoverAll','shadows'])document.querySelector('#'+id).onchange=()=>cards.forEach(draw);
const initialSearch=new URLSearchParams(location.search).get('search');if(initialSearch){document.querySelector('#filter').value=initialSearch;document.querySelector('#filter').dispatchEvent(new Event('input'));}
window.reviewReady=()=>cards.every(c=>c.icon||items.find(i=>i.slug===c.slug).status==='generation-blocked');
</script></html>
