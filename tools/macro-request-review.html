<!doctype html><html><head><meta charset="utf-8"><title>Macro illustration requests</title><style>
body{margin:0;background:#171122;color:#eee;font:16px system-ui}header{padding:28px 36px}h1{font-size:24px;margin:0 0 10px}p{color:#bfb6cd;margin:0}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px;padding:0 24px 30px}.card{background:#433193;border-radius:12px;overflow:hidden}h2{font-size:17px;margin:18px 20px}.scene{position:relative;height:330px;overflow:hidden}.scene img{position:absolute;left:50%;top:45%;pointer-events:none}.art{width:230px;transform:translate(-50%,-50%)}.shadow{width:690px;transform:translate(-50%,-50%);opacity:.85}.card a{color:#ded1ff;display:block;margin:12px 20px 20px;font-size:13px}
</style></head><body><header><h1>Macro illustrations — all 25 requests</h1><p>Shared upper-left lighting, display angles and long wall shadows.</p></header><main id="cards"></main><script type="module">
const subjects=["stone-of-the-pregnant-woman","big-rock-okotoks","colosseum","devils-tower","uluru","totem-pole-monument-valley","west-mitten-butte","morro-do-pai-inacio","sylacauga-meteorite","paro-moai","lake-geneva","lake-erie","lake-tanganyika","great-salt-lake","peekskill","crater-lake","vatnajokull","polar-bear","sperm-whale","humpback-whale","hindenburg","spirit-of-st-louis","codling-moth","wax-moth","tomato-leaf-miner"];
for(const slug of subjects){const card=document.createElement('article');card.className='card';card.innerHTML=`<h2>${slug.replaceAll('-',' ')}</h2><div class="scene"><img class="shadow" src="/content/icons/shadows/${slug}.webp"><img class="art" src="/content/icons/resolutions/512/${slug}.webp"></div><a href="/content/icons/src/${slug}.png" target="_blank">Full-resolution illustration ↗</a>`;document.querySelector('#cards').append(card)}
</script></body></html>
