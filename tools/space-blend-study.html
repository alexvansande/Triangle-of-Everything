<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galaxies and comets · blending study</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1200px;margin:auto;background:#171322;color:#eee8fa;font:16px system-ui}h1{font-size:25px;margin:0}p{line-height:1.5;color:#c0b4d0}a{color:#c7ed94}.controls{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin:24px 0}input{accent-color:#c7ed94}main{display:grid;grid-template-columns:1fr 1fr;gap:18px}article{border:1px solid #493a5b;border-radius:12px;overflow:hidden}.scene{--art-size:240px;height:300px;position:relative;isolation:isolate;background:linear-gradient(90deg,#ffffff0b 1px,transparent 1px),linear-gradient(#ffffff0b 1px,transparent 1px),#433193;background-size:40px 40px}img,.backing{position:absolute;left:50%;top:50%;width:var(--art-size);height:var(--art-size);transform:translate(-50%,-50%);object-fit:contain}.backing{border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.8),rgba(0,0,0,.5) 50%,transparent)}.backing.soft{background:radial-gradient(closest-side,rgba(0,0,0,.35),rgba(0,0,0,.15) 50%,transparent)}img{mix-blend-mode:screen}.trial{mask-composite:intersect;-webkit-mask-composite:source-in}footer{padding:15px;background:#211b2e}h2{font-size:16px;margin:0}small{color:#c0b4d0}@media(max-width:650px){body{padding:12px}.scene{--art-size:240px;height:220px}.scene{--art-size:180px}}
</style>
<h1>A darker core, softer edges</h1>
<p>Left: the original broad backing. Right: a small, faint backing under the core, brighter detail, and feathered image edges.</p>
<div class="controls"><label>Brightness <input id="brightness" type="range" min="1" max="1.6" step=".05" value="1.05"> <output>1.05×</output></label><a href="/#21.5,39.7,31.59">Open updated chart ↗</a><a href="/?legacyspace#21.5,39.7,31.59">Original treatment ↗</a></div>
<main></main>
<script type="module">
import {SPACE_ART_BRIGHTNESS,spaceCoreGeometry,spaceEdgeCss,isDiffuseSpaceArt} from '/src/space-art.js';
for(const [slug,name] of [['milky-way','Milky Way'],['andromeda-m31','Andromeda'],['halleys-comet','Halley’s Comet'],['stellar-nursery','Pillars of Creation']])for(const requestedTrial of [false,true]){
 const trial=requestedTrial&&isDiffuseSpaceArt('galaxy',slug);
 const core=trial?spaceCoreGeometry(slug,0,0,240):{cx:0,cy:0,r:240*.52};
 const el=document.createElement('article');el.innerHTML=`<div class="scene"><div class="backing ${trial?'soft':''}" style="width:calc(var(--art-size) * ${core.r*2/240});height:calc(var(--art-size) * ${core.r*2/240});left:calc(50% + var(--art-size) * ${core.cx/240})"></div><img ${trial?'class="trial"':''} src="/content/icons/${slug}.webp" alt="${name}"></div><footer><h2>${name}</h2><small>${trial?'Faint core · feathered edges':requestedTrial?'Original treatment retained':'Original backing'}</small></footer>`;document.querySelector('main').append(el);
 if(trial)el.querySelector('img').style.maskImage=spaceEdgeCss(slug);
}
const input=document.querySelector('input');input.value=SPACE_ART_BRIGHTNESS;
function update(){document.querySelector('output').value=Number(input.value).toFixed(2)+'×';document.querySelectorAll('.trial').forEach(im=>im.style.filter=`brightness(${input.value})`)}
input.oninput=update;update();
</script></html>
