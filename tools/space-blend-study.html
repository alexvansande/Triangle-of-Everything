<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Galaxies and comets · blending study</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;max-width:1200px;margin:auto;background:#171322;color:#eee8fa;font:16px system-ui}h1{font-size:25px;margin:0}p{line-height:1.5;color:#c0b4d0}a{color:#c7ed94}.controls{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin:24px 0}input{accent-color:#c7ed94}main{display:grid;grid-template-columns:1fr 1fr;gap:18px}article{border:1px solid #493a5b;border-radius:12px;overflow:hidden}.scene{height:300px;position:relative;isolation:isolate;background:linear-gradient(90deg,#ffffff0b 1px,transparent 1px),linear-gradient(#ffffff0b 1px,transparent 1px),#433193;background-size:40px 40px}img,.backing{position:absolute;left:50%;top:50%;width:240px;height:240px;transform:translate(-50%,-50%);object-fit:contain}.backing{width:250px;height:250px;border-radius:50%;background:radial-gradient(closest-side, rgba(0,0,0,.8) 0%,rgba(0,0,0,.5) 50%,transparent 100%)}img{mix-blend-mode:screen}footer{padding:15px;background:#211b2e}h2{font-size:16px;margin:0}small{color:#c0b4d0}@media(max-width:650px){body{padding:12px}.scene{height:220px}img,.backing{width:180px;height:180px}}
</style>
<h1>Light without the black backing</h1>
<p>Left: the current black backing. Right: screen blending directly onto the purple wall, with a small brightness boost. The background grid remains visible through the faint parts.</p>
<div class="controls"><label>Brightness <input id="brightness" type="range" min="1" max="1.6" step=".05" value="1.25"> <output>1.25×</output></label><a href="/?softspace#21.5,39.7,31.59">Try it in the chart ↗</a><a href="/#21.5,39.7,31.59">Current chart ↗</a></div>
<main></main>
<script type="module">
import {SPACE_ART_BRIGHTNESS} from '/src/space-art.js';
for(const [slug,name] of [['milky-way','Milky Way'],['andromeda-m31','Andromeda'],['halleys-comet','Halley’s Comet'],['stellar-nursery','Stellar nursery']])for(const trial of [false,true]){
 const el=document.createElement('article');el.innerHTML=`<div class="scene">${trial?'':'<div class="backing"></div>'}<img ${trial?'class="trial"':''} src="/content/icons/${slug}.webp" alt="${name}"></div><footer><h2>${name}</h2><small>${trial?'No backing · brighter':'Current backing'}</small></footer>`;document.querySelector('main').append(el);
}
const input=document.querySelector('input');input.value=SPACE_ART_BRIGHTNESS;
function update(){document.querySelector('output').value=Number(input.value).toFixed(2)+'×';document.querySelectorAll('.trial').forEach(im=>im.style.filter=`brightness(${input.value})`)}
input.oninput=update;update();
</script></html>
